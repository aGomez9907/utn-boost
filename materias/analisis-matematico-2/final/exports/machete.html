# MACHETE — Análisis Matemático II · Final

> Hoja de referencia del final. Recetas paso a paso con el *porqué* de cada paso difícil,
> fórmulas exactas de los apuntes, y al final una sección aparte con resultados de exámenes

>
> **Regla del examen: 3 de 6 — UN teórico (T1 o T2) + DOS prácticos (de P1–P4).**
> Primeros 10 minutos: leer los 6 enunciados con la tabla §0 al lado, elegir los 3, ignorar
> el resto.

## 1 · Flujo (cae en 23 de 24 finales)

### 1.1 Decidir el camino

Primero mirá la superficie, no el campo:

- **¿Encierra un cuerpo?** (dicen "frontera de", "superficie cerrada", o es esfera/cubo/cilindro con tapas) → **Gauss** (§1.2).
- **¿Es un trozo abierto?** (paraboloide con $z\ge0$, un plano recortado, un cilindro sin tapas, "$z=g(x,y)$ con tal condición") → **directo** (§1.3). Si el campo es feo pero la divergencia es fácil, **cerrar con tapa** (§1.4).

### 1.2 Gauss (superficie cerrada, normal saliente)

$$
\iint_{\partial V}f\cdot\hat n\,dS=\iiint_V\operatorname{div}f\,dV,\qquad \operatorname{div}f=P_x+Q_y+R_z
$$

1. Calculá $\operatorname{div}f$ derivando cada componente **sólo respecto de su propia variable** ($P$ respecto de $x$, $Q$ de $y$, $R$ de $z$). Por eso una componente que no depende de su variable aporta $0$: en $f=(g(y,z),\,h(x,z),\,z)$ la divergencia es $1$ aunque $g$ y $h$ sean desconocidas. Es el truco con el que la cátedra mete funciones desconocidas y términos como $e^{2xz}$ en $Q$ o $xe^{y}$ en $R$: mueren todos.
2. Si la divergencia es **constante**, el flujo es esa constante por el volumen del cuerpo — no integres nada: esfera $\tfrac43\pi R^3$, cilindro $\pi R^2h$, cono $\tfrac13\pi R^2h$, tetraedro de interceptos $a,b,c$: $\tfrac{abc}{6}$.
3. Si no es constante, planteá la integral triple en cilíndricas o esféricas (§7.1) y resolvé.
4. Gauss ya te da la orientación **saliente**. Si el enunciado pide entrante, cambiá el signo al final.

Variantes que caen como teórico: "¿es nulo el flujo por una esfera?" → calculá $\iiint\operatorname{div}f$; si la divergencia no es cero en el interior, no. "Hallá $a$ tal que flujo $=8\cdot$vol" → pedí $\operatorname{div}f\equiv8$ y despejá. "Inventá $f$ con flujo $=3\cdot$vol para toda superficie cerrada" → cualquier campo con $\operatorname{div}\equiv3$, por ejemplo $(x,y,z)$.

### 1.3 Flujo directo (superficie abierta)

$$
\Phi=\iint_S f\cdot\hat n\,dS=\iint_D f\big(r(u,v)\big)\cdot\big(r_u\times r_v\big)\,du\,dv
$$

La idea: **la normal sin normalizar ya trae el $dS$ adentro**, así que nunca calculás $\lVert r_u\times r_v\rVert$. Pasos:

1. **Elegí los dos parámetros.** Toda superficie se recorre con dos parámetros; hay dos maneras de elegirlos:
   - **Gráfica (la cómoda):** si de la ecuación podés **despejar una variable de forma única** en función de las otras dos —$z=g(x,y)$, o $y=g(x,z)$, o $x=g(y,z)$—, los parámetros son esas dos coordenadas: $r(x,y)=(x,\,y,\,g(x,y))$. La ventaja es que el producto vectorial ya está hecho, $r_x\times r_y=(-g_x,-g_y,1)$, y la región de integración es la **proyección** de la superficie sobre el plano de las dos variables libres. Sirve para paraboloides, planos, conos, semiesferas, $y=x^2$…
   - **Parametrización con otros parámetros (ángulo, altura, dos ángulos):** cuando **no se puede despejar de forma única**. Cilindro $x^2+y^2=R^2$: para un $(x,y)$ del borde hay infinitos $z$ → parámetros $(t,z)$. Esfera completa: a cada $(x,y)$ le corresponden dos $z$ → $(\theta,\varphi)$, o partirla en dos semiesferas. Acá sí hacés $r_u\times r_v$ a mano.

   Regla: primero probá despejar; si sale único, es gráfica y la normal está en la tabla. Si no, parametrizás. Las normales de las superficies que caen siempre:

| Superficie | $N$ (sin normalizar) | Hacia dónde apunta |
|---|---|---|
| gráfica $z=g(x,y)$ | $(-g_x,\,-g_y,\,1)$ | arriba ($z^+$) |
| gráfica $y=g(x,z)$ | $(-g_x,\,1,\,-g_z)$ | $y^+$ |
| gráfica $x=g(y,z)$ | $(1,\,-g_y,\,-g_z)$ | $x^+$ |
| plano $ax+by+cz=d$ | $(a,b,c)$ | según el signo de $c$ (o $b$, o $a$) |
| esfera centro $O$ | $(x,y,z)$ | saliente |
| cilindro $x^2+y^2=R^2$ | $(x,y,0)$ | saliente |
| cilindro corrido $(x-a)^2+y^2=R^2$ | $(x-a,\,y,\,0)$ | saliente |

   La regla general para gráficas: la variable despejada lleva el $1$ y las otras llevan $-$(derivada parcial).

2. **Fijá la orientación.** El enunciado la dice de alguna forma ("tercera componente positiva", "saliente", "normal con segunda componente negativa"). Mirá la componente que nombra en tu $N$: si tiene el signo pedido, listo; si no, usá $-N$. **Escribí en la hoja cuál elegiste**: lo piden explícitamente en casi todos los P y si no lo escribís lo descuentan.
3. **Reemplazá la superficie en el campo.** Si $z=g(x,y)$, todo $z$ que aparezca en $P,Q,R$ se cambia por $g(x,y)$. Es el paso que más se olvida.
4. **Hacé el producto escalar** $f\cdot N$. Para una gráfica $z=g$ queda directamente $-P\,g_x-Q\,g_y+R$.
5. **Encontrá la región $D$** donde integrás: es la **proyección** de la superficie sobre el plano de las dos variables libres. Sale de las condiciones del enunciado ($z\ge0$ en $z=9-x^2-y^2$ → $x^2+y^2\le9$; "primer octante" → $x,y\ge0$).
6. Integrá, casi siempre en polares.

Para un **cilindro** no hay gráfica $z=g(x,y)$ (a un $(x,y)$ le corresponden infinitos $z$): parametrizalo con el ángulo y $z$: $r(t,z)=(a+R\cos t,\ b+R\operatorname{sen}t,\ z)$. La normal $r_t\times r_z$ da $(R\cos t,R\operatorname{sen}t,0)$, saliente. El rango de $z$ sale del techo y el piso escritos en función de $t$; el rango de $t$, del octante.

### 1.4 Superficie abierta vía Gauss (cerrar con tapa)

Cuando la superficie es abierta pero el campo es feo y la divergencia es simple, cerrás el cuerpo agregando una tapa $T$, aplicás Gauss al cuerpo entero y despejás lo que querés:

$$
\Phi_S=\iiint_V\operatorname{div}f\,dV-\Phi_T\qquad(\text{todo con normal saliente})
$$

1. Elegí la tapa (casi siempre un disco plano $z=k$ o el plano de corte).
2. Calculá $\iiint_V\operatorname{div}f\,dV$ como en §1.2.
3. Calculá el flujo por la tapa **con la normal saliente del cuerpo**. Tapa plana $z=k$: $\hat n=(0,0,\pm1)$ (el signo que apunte hacia afuera del cuerpo), y $\Phi_T=\pm\iint_D R(x,y,k)\,dA$ — sólo interviene la tercera componente, evaluada en $z=k$.
4. Restá. Lo que te queda es el flujo por $S$ **con la normal saliente**.
5. Recién ahora compará con la orientación que pidió el enunciado: si es la opuesta, un signo $-$ global.

La trampa de teórico (`2026-02-10 T1a`): "¿se puede aplicar Gauss en forma directa a $x^2-2x+y^2=0$ con $-1\le z\le1$?" **No**: es un cilindro sin tapas, no encierra nada. Se puede usar Gauss sólo cerrándolo como acá. Y tampoco se aplica si el campo no está definido en algún punto del interior del cuerpo.

## 2 · Circulación: conservativo · Green · Stokes (22 de 24)

$$
\int_C f\cdot d\lambda=\int_a^b f(\lambda(t))\cdot\lambda'(t)\,dt
$$

Parametrizaciones que se usan siempre: segmento $A\to B$: $A+t(B-A)$, $t\in[0,1]$ · circunferencia $x^2+y^2=R^2$: $(R\cos t,R\operatorname{sen}t)$ · corrida $(x-a)^2+(y-b)^2=R^2$: $(a+R\cos t,\,b+R\operatorname{sen}t)$ · elipse $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$: $(a\cos t,\,b\operatorname{sen}t)$ · gráfica $y=g(x)$: $(t,g(t))$. Sentido: $\lambda(a)$ tiene que ser el punto inicial pedido; si parametrizaste al revés, cambiá el signo del resultado.

### 2.1 Primero, siempre: ¿es conservativo?

Antes de parametrizar nada, mirá si la **jacobiana es simétrica**: en 2D $P_y=Q_x$; en 3D además $P_z=R_x$ y $Q_z=R_y$ (equivale a $\operatorname{rot}f=\bar0$). Si lo es y el dominio no tiene agujeros, el campo es conservativo y

$$
\int_C f\cdot d\lambda=\varphi(B)-\varphi(A)\qquad(\text{curva cerrada}\Rightarrow0)
$$

sin importar la curva. Esto convierte un P de 40 minutos en uno de 10. Cómo armar el potencial $\varphi$:

1. $\varphi=\int P\,dx+c(y,z)$. La "constante" de integrar en $x$ es una función de las otras variables.
2. Derivá eso respecto de $y$ e igualalo a $Q$: sale $c_y$, integrás, y $c=\dots+d(z)$.
3. Derivá respecto de $z$, igualá a $R$: sale $d(z)$.
4. **Verificá $\nabla\varphi=f$** derivando. Si te dan un dato como $\varphi(1,0)=3$, ajustá la constante al final.

**Línea equipotencial por $P$:** es la curva de nivel $\varphi(x,y)=\varphi(P)$. Armás $\varphi$, ajustás la constante con el dato, y escribís $\varphi(x,y)=$ ese valor.

**Cuidado con los agujeros.** Si el campo no está definido en un punto (típico: denominador $x^2+y^2$), la simetría sola no alcanza para asegurar que sea conservativo. El campo $\frac{(-y,\,x)}{x^2+y^2}$ tiene jacobiana simétrica y **no** es conservativo en $\mathbb R^2-\{0\}$ (su circulación por cualquier circunferencia centrada en $O$ da $2\pi$). Pero sí lo es si te restringen a un dominio sin el agujero, como $y>0$ (`2025-12-09 T2b`). En cambio $\frac{(2x,\,2y)}{x^2+y^2}$ sí admite potencial en todo $\mathbb R^2-\{0\}$: $\varphi=\ln(x^2+y^2)+C$ — se ve armándolo con los pasos de arriba.

### 2.2 Green (curva plana cerrada)

$$
\oint_{C^+}(P,Q)\cdot d\lambda=\iint_D\big(Q_x-P_y\big)\,dA
$$

Hipótesis para nombrar: $C$ cerrada simple, frontera de $D$, recorrida en sentido **antihorario** ($C^+$), $f\in C^1$ en $D$.

1. Calculá $Q_x-P_y$. Acá es donde mueren las partes feas del campo: $e^{x^2}$ que está en $P$ y sólo depende de $x$ se va al derivar respecto de $y$; una $h(y)$ desconocida en $Q$ se va al derivar respecto de $x$. Si el enunciado tiene algo de eso, **es Green seguro**.
2. Si $Q_x-P_y$ es constante, la circulación es esa constante por el **área** de $D$. No integres.
3. Si no, integrá sobre $D$ (polares si es un disco; completá cuadrados si ves $x^2+y^2\le2x$).
4. Orientación: Green da la antihoraria. Si el enunciado dice "sentido negativo" u "horario", signo $-$.

**Área por Green** (es la mitad del teórico T-B): si elegís un campo con $Q_x-P_y=1$, la circulación es el área. Campos que sirven: $(0,x)$, $(-y,0)$, $\tfrac12(-y,x)$. De ahí $A=\oint x\,dy=-\oint y\,dx=\tfrac12\oint(x\,dy-y\,dx)$.

**"Hallá $h$ tal que la circulación sea $4\cdot$área$(D)$ para toda $D$"** (`2026-02-24 P2`): eso es pedir $Q_x-P_y\equiv4$; te queda una EDO en $h$ (§3).

### 2.3 Green con curva abierta (cerrar con un segmento)

Cae seguido (`2026-05-19 T1b`, `2026-07-14 P3`, `2026-02-10 P3`): la curva va de $A$ a $B$ sobre el eje $x$, el campo tiene una parte desconocida o fea, y no se puede integrar directo.

1. Cerrá la curva con el **segmento** que une $B$ con $A$ (casi siempre sobre el eje $x$).
2. Green a la curva cerrada: $\oint=\int_C+\int_{\text{seg}}=\iint_D(Q_x-P_y)\,dA$.
3. Despejá: $\int_C=\iint_D(Q_x-P_y)\,dA-\int_{\text{seg}}$.
4. El segmento sobre el eje $x$ es fácil: $y=0$ y $dy=0$, así que sólo sobrevive $\int P(x,0)\,dx$ entre las abscisas correspondientes. Por eso el enunciado te da "$f(x,0)=(x^2,6x)$": es el dato para este paso.
5. Cuidá que el sentido de $C$ más el segmento sea antihorario; si no, ajustá signos.

### 2.4 Stokes (curva en el espacio)

$$
\oint_{C^+}f\cdot d\lambda=\iint_S\operatorname{rot}f\cdot\hat n\,dS,\qquad \operatorname{rot}f=\begin{vmatrix}\hat i&\hat j&\hat k\\ \partial_x&\partial_y&\partial_z\\ P&Q&R\end{vmatrix}=(R_y-Q_z,\;P_z-R_x,\;Q_x-P_y)
$$

La idea: la circulación por una curva fea se cambia por el flujo del rotor a través de **cualquier superficie que tenga esa curva como borde**, y vos elegís la más cómoda: una **plana**, porque su normal es constante.

1. **Encontrá la curva.** Es la intersección de dos superficies. Igualalas para sacar la proyección $D$ (una circunferencia o una elipse) y la altura o el plano donde vive.
2. **Elegí $S$ plana** con ese borde: si una de las superficies es un plano, ese trozo de plano; si la curva es una circunferencia a altura $z_0$, el disco $z=z_0$.
3. **Calculá $\operatorname{rot}f$.** Si en vez de $f$ te dan la **matriz jacobiana $Df$**, el rotor se lee directamente de ella: $R_y$ es la entrada fila 3 columna 2, $Q_z$ es fila 2 columna 3, etc. Las entradas de la diagonal ($P'_x,Q'_y,R'_z$), que suelen venir como incógnitas, **no se usan**: por eso te las dejan sin dato. Si te dan directamente $\operatorname{rot}f$, mejor.
4. **Normal de $S$:** para el plano $ax+by+cz=d$ es $(a,b,c)$; para el disco horizontal, $(0,0,\pm1)$. Producto escalar $\operatorname{rot}f\cdot N$, reemplazando $z$ por su expresión en el plano.
5. Integrá sobre $D$. Términos con $x$, $y$ o $xy$ sueltos integran $0$ sobre un disco centrado en el origen (simetría); sobre un disco corrido, no — completá cuadrados y mirá.
6. **Orientación (mano derecha):** el pulgar es $\hat n$, los dedos recorren $C$. Si mirás desde arriba ($\hat n=+\hat k$), $C$ va antihoraria. **Escribí cuál elegiste**; si el enunciado la fija y es la otra, signo $-$.

V/F típico (`2025-02-25 T1b`): "la circulación de $f$ por cualquier curva cerrada contenida en el plano $y=k$ es nula". Como $\hat n=(0,\pm1,0)$, sólo importa la segunda componente del rotor: $P_z-R_x$. Si es $0$, es verdadero por Stokes.

### 2.5 "Hallar $g$ para que…"

El esquema es siempre el mismo: la condición pedida se convierte en una ecuación diferencial en $g$.

- conservativo → $P_y=Q_x$
- solenoidal → $\operatorname{div}f=0$
- flujo $=k\cdot$volumen para todo cuerpo → $\operatorname{div}f\equiv k$
- circulación $=k\cdot$área para toda región → $Q_x-P_y\equiv k$

Planteás, te queda casi siempre una EDO de 2º orden en $g$ (porque aparece $g''$ al derivar $g'$), la resolvés con §3.1 y usás el dato tipo $f(0,1)=(13,4)$ para sacar $g(0)$ y $g'(0)$ y fijar las constantes.

## 3 · Ecuaciones diferenciales (22 de 24)

### 3.1 Segundo orden: $y''+ay'+by=h(x)$

La solución es $y=y_H+y_p$: la general de la homogénea más una particular de la completa.

**Paso 1 — homogénea.** Ecuación característica $r^2+ar+b=0$:

| Raíces | $y_H$ |
|---|---|
| $r_1\ne r_2$ reales | $C_1e^{r_1x}+C_2e^{r_2x}$ |
| $r$ doble | $(C_1+C_2x)\,e^{rx}$ |
| $\alpha\pm\beta i$ | $e^{\alpha x}\big(C_1\cos\beta x+C_2\operatorname{sen}\beta x\big)$ |

**Paso 2 — particular por coeficientes indeterminados.** Proponés un $y_p$ con la misma forma que $h(x)$, con coeficientes a determinar; lo reemplazás en la ecuación y comparás coeficientes:

| $h(x)$ | candidato $y_p$ |
|---|---|
| polinomio de grado $n$ | polinomio COMPLETO de grado $n$ (todos los términos, aunque $h$ no los tenga) |
| $Ce^{kx}$ | $Ae^{kx}$ |
| $\cos\omega x$ y/o $\operatorname{sen}\omega x$ | $A\cos\omega x+B\operatorname{sen}\omega x$ (siempre los dos, aunque $h$ tenga uno solo) |
| suma de varios | suma de los candidatos |

**Resonancia — el caso que traba a todos.** Antes de derivar, mirá si tu candidato **ya aparece en $y_H$**. Si sí, al reemplazarlo va a dar $0$ y no vas a poder despejar. Solución: multiplicá el candidato por $x$; si la raíz es doble, por $x^2$. Ejemplos: $y''-y=4e^{x}$ tiene $r=1$ en $y_H$, así que $y_p=Axe^{x}$. $y''+2y'+y=2e^{-x}$ tiene $r=-1$ doble, así que $y_p=Ax^2e^{-x}$. Caso escondido: si $b=0$, $r=0$ es raíz, y una constante en $h$ "resuena": para $y''+4y'=8$ el candidato es $Ax$, no $A$.

**Paso 3 — condiciones.** Recién con $y=y_H+y_p$ completa aplicás los datos; si los aplicás sobre $y_H$ sola, mal. Formas en que vienen los datos:

- $y(0)=a$, $y'(0)=b$ → sistema $2\times2$ en $C_1,C_2$.
- "recta tangente $y=mx+c$ en $(0,y_0)$" → significa $y(0)=c$ **y** $y'(0)=m$.
- "$\lim_{x\to+\infty}y_G$" → no hace falta fijar constantes: mirá qué términos sobreviven ($e^{-x}\to0$, $x^2e^{-x}\to0$, $e^{2x}\to\infty$).
- "máximo y mínimo de la solución en $[0,\pi]$" → resolvés la EDO y después es un problema de extremos de una variable (derivar, igualar a cero, comparar con los bordes).

### 3.2 Primer orden y trayectorias ortogonales

| Tipo | Cómo se reconoce | Cómo se resuelve |
|---|---|---|
| separable | $y'=A(x)B(y)$ | $\int\frac{dy}{B(y)}=\int A(x)\,dx$ |
| lineal | $y'+P(x)y=Q(x)$ | $\mu=e^{\int P\,dx}$; $y=\frac1\mu\big(\int\mu Q\,dx+C\big)$ |
| exacta | $M\,dx+N\,dy=0$ con $M_y=N_x$ | es $d\varphi=0$: armá $\varphi$ como en §2.1 y la solución es $\varphi=C$ |
| no exacta | $M_y\ne N_x$ | probá multiplicar por $x^k$ o $y^k$ hasta que sea exacta |

**Trayectorias ortogonales.** Dos curvas son ortogonales si sus pendientes en el punto de cruce multiplican $-1$.

1. Tomá la familia $F(x,y,C)=0$, derivala implícitamente y **eliminá la constante** $C$ (despejala de la ecuación original y reemplazala). Te queda $y'=f(x,y)$: la pendiente de la familia en cada punto, sin depender de qué curva sea.
2. La familia ortogonal cumple $y'=-1/f(x,y)$.
3. Resolvé esa EDO (en todos los finales del dataset salió separable). Si dan un punto, ajustá la constante.

"Hallá $a$ para que $y=kx^3$ y $x^2+ay^2=C$ sean ortogonales" es lo mismo sin resolver nada: sacá la pendiente de cada familia (eliminando su constante), multiplicalas, igualá a $-1$ y despejá $a$. La receta general que sale: $y=kx^n$ es ortogonal a $x^2+ny^2=C$.

### 3.3 Líneas de campo

Las líneas de campo de $F=(P,Q)$ son las curvas tangentes al campo en cada punto: $\dfrac{dy}{dx}=\dfrac{Q(x,y)}{P(x,y)}$. Es una EDO de primer orden; se resuelve con §3.2 y se ajusta con el punto dado. Para un campo conservativo, las líneas de campo son perpendiculares a las equipotenciales (porque el gradiente es perpendicular a las curvas de nivel, §5.1).

## 4 · Implícita · plano tangente · curvas en el espacio (16 de 24)

### 4.1 Derivación implícita

Si $z=f(x,y)$ viene definida por $F(x,y,z)=0$:

$$
f_x=-\frac{F_x}{F_z},\qquad f_y=-\frac{F_y}{F_z}\qquad(F_z\ne0)
$$

1. **Hallá el punto base primero.** Te dan $(x_0,y_0)$; reemplazá en $F=0$ y despejá $z_0$. Probá enteros chicos que anulen el logaritmo ($\ln1=0$) o el exponente ($e^0=1$).
2. Calculá $F_x,F_y,F_z$ derivando $F$ como si $x,y,z$ fueran independientes, y evaluá en $(x_0,y_0,z_0)$.
3. Aplicá las fórmulas. Justificación para el teórico: $F(P)=0$, $F\in C^1$ y $F_z(P)\ne0$ garantizan que $z=f(x,y)$ existe y es $C^1$ cerca de $P$ (teorema de la función implícita).

Si la función implícita es $z=g(u,v)$ dada por $G(u,v,z)=0$, es lo mismo con $u,v$ en lugar de $x,y$.

### 4.2 Plano tangente y recta normal a una superficie

| Cómo viene la superficie | Normal $\bar N$ | Plano tangente en $P$ |
|---|---|---|
| implícita $F(x,y,z)=0$ | $\nabla F(P)$ | $\nabla F(P)\cdot(X-P)=0$ |
| gráfica $z=g(x,y)$ | $(g_x,\,g_y,\,-1)$ | $z=g(P)+g_x\,\Delta x+g_y\,\Delta y$ |
| paramétrica $\sigma(u,v)$ | $\sigma_u\times\sigma_v$ | $(\sigma_u\times\sigma_v)\cdot(X-P)=0$ |

- **Recta normal:** $X=P+t\,\bar N$. Si preguntan si corta a otra superficie, meté $X(t)$ en la ecuación de esa superficie y resolvé en $t$.
- **"Puntos donde el plano tangente es paralelo a $ax+by+cz=d$":** dos planos son paralelos si sus normales son proporcionales. Planteá $\nabla F(X_0)=\lambda(a,b,c)$ junto con $X_0\in S$; es un sistema con $\lambda$ como incógnita extra.
- **"Plano tangente horizontal"** a $z=f(x,y)$: $\nabla f=(0,0)$, o sea un punto crítico (§6).
- **Superficie parametrizada, punto regular:** $P$ es regular si $\sigma_u\times\sigma_v\ne\bar0$ en el $(u,v)$ que produce $P$. Primero hay que encontrar ese $(u,v)$ resolviendo $\sigma(u,v)=P$.

### 4.3 Curvas en el espacio

Una curva dada como intersección de dos superficies $F_1=0$ y $F_2=0$ tiene, en cada punto, vector tangente perpendicular a las dos normales:

$$
\bar T=\nabla F_1(P)\times\nabla F_2(P)
$$

- **Recta tangente:** $X=P+t\,\bar T$. **Plano normal:** $\bar T\cdot(X-P)=0$ (el plano que tiene a $\bar T$ como normal; no confundir con el plano tangente a una superficie).
- Curva paramétrica $\lambda(t)$: $\bar T=\lambda'(t_0)$, donde $t_0$ es el parámetro que da el punto (resolvé $\lambda(t)=P$).
- **Punto regular** de una curva: $\lambda'(t_0)\ne\bar0$. Si el vector derivada se anula, no hay dirección tangente y el punto no es regular. **Simple:** la curva no pasa dos veces por el mismo punto en el intervalo.
- Si la curva viene con una función que hay que hallar antes ("$z=\varphi(x)-y$ con $\varphi$ solución de $y''=6x$"), resolvé la EDO primero (§3.1) y después es esto.
- "El plano tangente a $S$ y la recta tangente a $C$ son perpendiculares en $P$" quiere decir $\nabla F(P)\parallel\lambda'(t_0)$.

## 5 · Gradiente · derivada direccional · cadena · aproximación (12 de 24)

### 5.1 Derivada direccional

$$
f'(A,\hat u)=\nabla f(A)\cdot\hat u\qquad(\hat u\ \text{unitario})
$$

Como $\nabla f\cdot\hat u=\lVert\nabla f\rVert\cos\theta$, todo sale de mirar el ángulo entre $\hat u$ y el gradiente:

| Piden | Valor | Dirección |
|---|---|---|
| máxima (máximo crecimiento) | $\lVert\nabla f(A)\rVert$ | $\hat u=\nabla f/\lVert\nabla f\rVert$ |
| mínima (**máximo decrecimiento**) | $-\lVert\nabla f(A)\rVert$ | $\hat u=-\nabla f/\lVert\nabla f\rVert$ |
| nula | $0$ | las perpendiculares a $\nabla f$: en 2D $\pm(-f_y,\,f_x)/\lVert\nabla f\rVert$ |

- Si el enunciado da un vector **no unitario** y dice "según $\bar v$", esta cátedra suele tomar $\nabla f\cdot\bar v$ sin normalizar; si dice "en la dirección de" o "versor", normalizá. En caso de duda, normalizá y **aclaralo por escrito**.
- "$\hat u$ normal a la superficie $G=0$ en $P$, orientado hacia el origen": $\hat u=\pm\nabla G(P)/\lVert\nabla G(P)\rVert$, con el signo que haga que apunte hacia $O$ (compará con el vector $O-P$).
- **El gradiente es perpendicular a las curvas y superficies de nivel.** Por eso "recta normal a la curva de nivel $c$ por $P$" es $X=P+t\,\nabla f(P)$, y "recta tangente a la curva de nivel" es la perpendicular al gradiente.
- Si $f=x+y\,g(x,y)$ con $g(P)=0$ y $\nabla g(P)$ dado: $\nabla f(P)=(1,0)+g(P)\cdot(0,1)+y_0\,\nabla g(P)=(1,0)+y_0\nabla g(P)$ — regla del producto, término a término.

### 5.2 Regla de la cadena

$$
h=f\circ g\ \Rightarrow\ \nabla h(A)=\nabla f\big(g(A)\big)\cdot Dg(A)
$$

$Dg$ es la matriz jacobiana de $g$ (una fila por componente de $g$, una columna por variable). La trampa: **$\nabla f$ se evalúa en el punto imagen $g(A)$, no en $A$**. Pasos: calculá $g(A)$ → evaluá $\nabla f$ ahí (si $f$ es implícita, con §4.1) → armá $Dg(A)$ → multiplicá. Con $\nabla h$ en la mano seguís con §5.1.

Caso $g(x,y)=x\cdot f(x,y)$ (`2024-10-09 P3`): no es composición, es producto: $\nabla g=(f+x f_x,\ x f_y)$.

### 5.3 Aproximación lineal

$$
z\approx z_0+z_x(x_0,y_0)\,\Delta x+z_y(x_0,y_0)\,\Delta y,\qquad\Delta x=x-x_0,\ \Delta y=y-y_0
$$

El punto base $(x_0,y_0)$ es el "redondo" cercano al pedido ($(2,1)$ para $(2.02,0.98)$); las derivadas salen por implícita (§4.1) o por cadena (§5.2). Los $\Delta$ llevan signo. Si la función es una combinación, como $G=y_p-4F$ (`2026-02-10 P1`), el gradiente se arma linealmente: $\nabla G=(y_p'(x),\,0)-4\nabla F$.

### 5.4 Leer datos de un Taylor de grado 2

$$
p(x,y)=f+f_x\,\Delta x+f_y\,\Delta y+\tfrac12\big(f_{xx}\,\Delta x^2+2f_{xy}\,\Delta x\,\Delta y+f_{yy}\,\Delta y^2\big)
$$

Del polinomio dado leés: $f(a,b)=$ término independiente; $\nabla f=$ (coef. de $\Delta x$, coef. de $\Delta y$); $f_{xx}=2\cdot$coef$(\Delta x^2)$; $f_{xy}=$ coef$(\Delta x\Delta y)$; $f_{yy}=2\cdot$coef$(\Delta y^2)$. Con eso: plano tangente (usa $f$ y $\nabla f$) y extremos (sólo si **no hay términos lineales**, es decir $\nabla f=0$; entonces clasificás con el Hessiano leído, §6). Si te dan "la matriz jacobiana de $\nabla f$", eso es el Hessiano directamente.

### 5.5 Función partida en $(0,0)$: los V/F

- **Derivada direccional por definición:** $f'\big((0,0),(a,b)\big)=\lim_{t\to0}\dfrac{f(ta,tb)-f(0,0)}{t}$. Reemplazá y mirá si el límite existe y cómo depende de $(a,b)$. Las parciales son los casos $(1,0)$ y $(0,1)$.
- **Continuidad:** ¿$\lim_{(x,y)\to(0,0)}f=f(0,0)$? Para negarlo, dos trayectorias ($y=mx$, $y=kx^2$) con límites distintos. Para afirmarlo, acotar o pasar a polares.
- **Diferenciabilidad** (⇔ admite plano tangente): que existan las parciales **no alcanza**. Hay que ver si $\dfrac{f(h,k)-f(0,0)-f_x h-f_y k}{\sqrt{h^2+k^2}}\to0$. Para las funciones tipo $\frac{2x^2y}{x^2+y^2}$ o $\frac{xy^2}{x^2+y^2}$ las parciales en el origen valen $0$ y el cociente, por la recta $h=k$, da una constante distinta de $0$: **no diferenciable, no hay plano tangente** (`2026-07-28 T1b`, `2025-12-16 T2b`, `2024-03-05 T2b`).
- "Todo campo diferenciable en un punto es derivable (tiene derivadas direccionales) en ese punto": **verdadero**, y la razón es la fórmula $f'(A,\hat u)=\nabla f\cdot\hat u$, que vale justamente por ser diferenciable.

## 6 · Extremos (12 de 24)

1. **Puntos críticos:** resolvé $\nabla f=(f_x,f_y)=(0,0)$. Cada solución es un candidato.
2. **Hessiano** en cada candidato:

$$
H=\begin{pmatrix}f_{xx}&f_{xy}\\ f_{xy}&f_{yy}\end{pmatrix},\qquad D=f_{xx}f_{yy}-f_{xy}^2
$$

| $D>0$ y $f_{xx}>0$ | $D>0$ y $f_{xx}<0$ | $D<0$ | $D=0$ |
|---|---|---|---|
| mínimo local | máximo local | punto silla (no es extremo) | el criterio no decide |

Cuando $D=0$, o cuando la función tiene raíces, valores absolutos o potencias cuartas que hacen inútil el Hessiano, se argumenta **directo con el signo de $f-f(P)$**: $(x-y)^4+(y-1)^2\ge0=f(1,1)$ para todo $(x,y)$, así que $(1,1)$ es mínimo absoluto; y es **estricto** porque la igualdad sólo se da ahí. Lo mismo $9-\sqrt{4x^2+2y^4}\le9=f(0,0)$: máximo.

**Extremos absolutos en una región cerrada** ($x^2+y^2\le4$, un triángulo, etc.): los extremos pueden estar adentro o en el borde, así que se buscan en los dos lados y se comparan.

1. Adentro: puntos críticos con $\nabla f=0$ que caigan dentro de la región (puede no haber ninguno).
2. En la frontera: parametrizala (circunferencia → $(2\cos t,2\operatorname{sen}t)$) y buscá extremos de $f(\lambda(t))$ como función de una variable; o Lagrange, $\nabla f=\lambda\nabla g$ con $g=0$ la frontera.
3. Evaluá $f$ en todos los candidatos; el mayor es el máximo absoluto y el menor, el mínimo.

"$f$ no tiene máximos locales" se prueba mostrando que en todo punto crítico no puede darse $D>0$ con $f_{xx}<0$ (por ejemplo, si $f_{yy}$ es una constante positiva, nunca hay máximo).

## 7 · Integrales múltiples · cambio de variables · área de superficie (13 de 24)

### 7.1 Cambio de variables

$$
\iint_D f\,dx\,dy=\iint_{D^*}f\big(x(u,v),y(u,v)\big)\,\lvert J\rvert\,du\,dv,\qquad J=\det\frac{\partial(x,y)}{\partial(u,v)}
$$

| Sistema | Fórmulas | $\lvert J\rvert$ |
|---|---|---|
| Polares | $x=\rho\cos\varphi$, $y=\rho\operatorname{sen}\varphi$ | $\rho$ |
| Cilíndricas | polares + $z=z$ | $\rho$ |
| Esféricas | $x=\rho\operatorname{sen}\theta\cos\varphi$, $y=\rho\operatorname{sen}\theta\operatorname{sen}\varphi$, $z=\rho\cos\theta$ | $\rho^2\operatorname{sen}\theta$ |

($\theta$ es el ángulo desde el eje $z^+$, de $0$ a $\pi$; $\varphi$ el ángulo en el plano $xy$.)

- **Transformación lineal** $(x,y)=T(u,v)$: el jacobiano es constante y sale de la integral, así que área$(D)=\lvert J\rvert\cdot$área$(D^*)$. Es el teórico reciclado "dan área$(D)$ y piden área$(D^*)$": calculás $J$ de $T$, tomás **módulo** (un área no es negativa) y dividís.
- **Pasar de polares a cartesianas:** $\rho=2a\cos\varphi$ es la circunferencia $x^2+y^2=2ax$ (centro $(a,0)$, radio $a$); $\rho=2a\operatorname{sen}\varphi$, centro $(0,a)$. El rango de $\varphi$ dice qué porción. Un $\rho^n\,d\rho\,d\varphi$ es $\rho^{n-1}\cdot(\rho\,d\rho\,d\varphi)$, o sea integrando $(x^2+y^2)^{(n-1)/2}$ con $dA$.
- **Cuándo usar cada sistema:** cilindro / paraboloide / cono con tapa plana → cilíndricas. Esfera sola, o cono ∩ esfera → esféricas (el cono $z=\sqrt{x^2+y^2}$ es $\theta=\pi/4$; cono ∩ esfera de radio $R$ se cortan en la circunferencia $\rho=R/\sqrt2$ a altura $z=R/\sqrt2$).
- **V/F "esta integral en cilíndricas calcula el volumen de…":** revisá tres cosas, en este orden: (1) el techo y el piso de $z$, (2) el rango de $\rho$ — tiene que llegar hasta la **intersección** de las superficies, no hasta el radio de la esfera —, (3) que el jacobiano $\rho$ esté en el integrando.

### 7.2 Volumen y masa

$$
V=\iint_D\big(z_{\text{techo}}-z_{\text{piso}}\big)\,dA,\qquad m=\iiint_V\delta\,dV
$$

1. Dibujá o al menos identificá las superficies (paraboloide, cono, cilindro, plano). $x^2+y^2\le2x$ es un cilindro corrido: **completá cuadrados**.
2. Proyectá sobre el plano $xy$: la región $D$ es donde techo $\ge$ piso; igualalos para encontrar el borde.
3. Restá techo − piso **antes** de integrar; suelen cancelarse términos.
4. Elegí coordenadas (§7.1) e integrá.

**Densidad "proporcional a la distancia":** al eje $z$ → $\delta=k\sqrt{x^2+y^2}=k\rho$; al plano $xy$ → $\delta=k|z|$; al plano $yz$ → $\delta=k|x|$; al origen → $\delta=k\rho$ en esféricas. La constante $k$ se deja indicada.

**"Exprese mediante una integral" / "no es necesario resolver":** vale sólo el planteo, pero completo: los tres límites, el integrando con la densidad, y el jacobiano. **"Dos integrales distintas":** proyectá una vez sobre $xy$ (queda $dz$ adentro) y otra sobre $xz$ o $yz$ (queda $dy$ o $dx$ adentro); los límites cambian, el valor no.

### 7.3 Área de superficie e integral de superficie escalar

$$
dS=\sqrt{1+g_x^2+g_y^2}\,dA\ \ (z=g(x,y)),\qquad A=\iint_D dS,\qquad \iint_S h\,d\sigma=\iint_D h\big(x,y,g(x,y)\big)\,dS
$$

1. Escribí la superficie como gráfica $z=g(x,y)$ y calculá $\sqrt{1+g_x^2+g_y^2}$. Para el cono $z=\sqrt{x^2+y^2}$ da $\sqrt2$ constante; para un plano $z=ax+by+c$, $\sqrt{1+a^2+b^2}$ constante. Cuando es constante, el área es esa constante por el área de la proyección $D$ — no integres.
2. Encontrá $D$ (proyección) a partir de las condiciones.
3. Si es una integral escalar $\iint_S h\,d\sigma$, reemplazá $z$ por $g$ en $h$ e integrá sobre $D$. Un $\iint_D y\,dA$ sobre un disco corrido es $\bar y\cdot$área$(D)$ con $\bar y$ el centro del disco.

### 7.4 Figuras conocidas: coordenadas, áreas, volúmenes e integrales que se repiten

**Polares elípticas.** Para una región $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}\le1$ (o un paraboloide/cilindro cuya proyección es esa elipse), las polares comunes no sirven porque el borde no queda en $\rho=$ cte. Se usa:

$$
x=a\,\rho\cos\varphi,\qquad y=b\,\rho\operatorname{sen}\varphi,\qquad \rho\in[0,1],\ \varphi\in[0,2\pi],\qquad \lvert J\rvert=a\,b\,\rho
$$

Con eso $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=\rho^2$, la elipse es $\rho\le1$ y el jacobiano es $ab\rho$ (no $\rho$). Primero llevá la ecuación a la forma $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$ para leer $a$ y $b$: $9x^2+y^2\le9$ → $x^2+\frac{y^2}{9}\le1$ → $a=1$, $b=3$. $x^2+4y^2\le4$ → $\frac{x^2}{4}+y^2\le1$ → $a=2$, $b=1$. Cuarto de elipse en el primer cuadrante: $\varphi\in[0,\pi/2]$. Si la elipse está corrida ($\frac{x^2}{4}+y^2=2y$ → $\frac{x^2}{4}+(y-1)^2=1$), sumale el centro: $y=1+\rho\operatorname{sen}\varphi$.

**Elipsoide** $\frac{x^2}{a^2}+\frac{y^2}{b^2}+\frac{z^2}{c^2}\le1$: esféricas escaladas $x=a\rho\operatorname{sen}\theta\cos\varphi$, $y=b\rho\operatorname{sen}\theta\operatorname{sen}\varphi$, $z=c\rho\cos\theta$, $\rho\in[0,1]$, $\lvert J\rvert=abc\,\rho^2\operatorname{sen}\theta$.

**Áreas planas** (cuando $\sqrt{1+g_x^2+g_y^2}$ o $Q_x-P_y$ o $\operatorname{div}f$ es constante, el problema termina acá):

| Figura | Área |
|---|---|
| disco de radio $R$ (centrado o corrido, da igual) | $\pi R^2$ |
| semidisco / cuarto de disco | $\tfrac12\pi R^2$ / $\tfrac14\pi R^2$ |
| elipse de semiejes $a,b$ | $\pi ab$ |
| cuarto de elipse (1er cuadrante) | $\tfrac14\pi ab$ |
| triángulo de vértices $A,B,C$ | $\tfrac12\lvert(B-A)\times(C-A)\rvert$ (en el plano: $\tfrac12\lvert\det\rvert$) |
| triángulo de interceptos $(a,0)$, $(0,b)$ | $\tfrac12 ab$ |
| corona $r\le\rho\le R$ | $\pi(R^2-r^2)$ |
| sector de ángulo $\alpha$ y radio $R$ | $\tfrac12\alpha R^2$ |

**Volúmenes** (para Gauss con divergencia constante, y para chequear un volumen calculado):

| Cuerpo | Volumen |
|---|---|
| esfera radio $R$ | $\tfrac43\pi R^3$ (semiesfera: la mitad; un octante: $\tfrac16\pi R^3$) |
| elipsoide de semiejes $a,b,c$ | $\tfrac43\pi abc$ |
| cilindro radio $R$, altura $h$ | $\pi R^2h$ |
| cilindro elíptico $\frac{x^2}{a^2}+\frac{y^2}{b^2}\le1$, altura $h$ | $\pi abh$ |
| cono radio $R$, altura $h$ (también el cono $z=\sqrt{x^2+y^2}$ bajo $z=h$: $R=h$) | $\tfrac13\pi R^2h$ |
| paraboloide $z=h-\frac{x^2+y^2}{k}$ sobre $z\ge0$ (base radio $R=\sqrt{kh}$) | $\tfrac12\pi R^2h$ — la **mitad** del cilindro que lo contiene |
| paraboloide elíptico $z=c\big(1-\frac{x^2}{a^2}-\frac{y^2}{b^2}\big)$ sobre $z\ge0$ | $\tfrac12\pi abc$ |
| entre dos paraboloides / paraboloide y plano | proyectar, restar techo − piso, polares (§7.2); no hay atajo |
| tetraedro de interceptos $a,b,c$ | $\tfrac{abc}6$ |
| cuña $0\le z\le h$ sobre un semidisco | $\tfrac12\pi R^2h$ |

**Centroides**, para integrales del tipo $\iint_D x\,dA$ o $\iint_D y\,dA$ que aparecen en flujos y en Green: $\iint_D x\,dA=\bar x\cdot\text{área}(D)$, con $\bar x$ el centro geométrico.

| Región | $(\bar x,\bar y)$ |
|---|---|
| disco o elipse centrados en $(x_0,y_0)$ | $(x_0,y_0)$ — por eso $\iint x\,dA$ y $\iint y\,dA$ dan $0$ si está centrada en el origen |
| semidisco $y\ge0$ de radio $R$ | $\big(0,\tfrac{4R}{3\pi}\big)$ |
| cuarto de disco (1er cuadrante) | $\big(\tfrac{4R}{3\pi},\tfrac{4R}{3\pi}\big)$ |
| triángulo de vértices $A,B,C$ | $\tfrac13(A+B+C)$ |
| tetraedro de interceptos $a,b,c$ | $\big(\tfrac a4,\tfrac b4,\tfrac c4\big)$ (sirve para $\iiint y\,dV=\tfrac b4\cdot V$) |

**Integrales trigonométricas que salen siempre** (en polares, cilíndricas y parametrizaciones):

| Integral | Valor |
|---|---|
| $\int_0^{2\pi}\cos\varphi\,d\varphi=\int_0^{2\pi}\operatorname{sen}\varphi\,d\varphi=\int_0^{2\pi}\operatorname{sen}\varphi\cos\varphi\,d\varphi$ | $0$ |
| $\int_0^{2\pi}\cos^2\varphi\,d\varphi=\int_0^{2\pi}\operatorname{sen}^2\varphi\,d\varphi$ | $\pi$ |
| $\int_0^{\pi}\operatorname{sen}\varphi\,d\varphi$ | $2$ |
| $\int_0^{\pi}\operatorname{sen}^2\varphi\,d\varphi=\int_0^{\pi}\cos^2\varphi\,d\varphi$ | $\pi/2$ |
| $\int_0^{2\pi}\cos^3\varphi\,d\varphi=\int_0^{2\pi}\operatorname{sen}^3\varphi\,d\varphi$ | $0$ (toda potencia impar sobre una vuelta completa) |
| $\int_0^{\pi/2}\operatorname{sen}\varphi\cos\varphi\,d\varphi$ | $\tfrac12$ |
| $\int_0^R\rho^n\,d\rho$ | $\tfrac{R^{n+1}}{n+1}$; con $\sqrt{1+4\rho^2}\,\rho$ (área de paraboloide): $\tfrac1{12}\big[(1+4R^2)^{3/2}-1\big]$ |

Regla mental: sobre una vuelta completa, cualquier término con una potencia impar de $\cos$ o de $\operatorname{sen}$ (o el producto $\operatorname{sen}\cos$) integra $0$; los cuadrados dan $\pi$. Eso es lo que hace que en Stokes y en Gauss "desaparezcan" los términos con $x$, $y$ o $xy$ sobre un disco centrado.

**$dS$ de superficies que se repiten:**

| Superficie | $dS$ | Área |
|---|---|---|
| plano $z=ax+by+c$ | $\sqrt{1+a^2+b^2}\,dA$ | $\sqrt{1+a^2+b^2}\cdot$área$(D)$ |
| cono $z=\sqrt{x^2+y^2}$ | $\sqrt2\,dA$ | $\sqrt2\cdot$área$(D)$ |
| cono $z=k\sqrt{x^2+y^2}$ | $\sqrt{1+k^2}\,dA$ | $\sqrt{1+k^2}\cdot$área$(D)$ |
| esfera de radio $R$ | $R^2\operatorname{sen}\theta\,d\theta\,d\varphi$ | $4\pi R^2$ (casquete $z\ge h$: $2\pi R(R-h)$) |
| cilindro $x^2+y^2=R^2$ | $R\,dt\,dz$ | $2\pi Rh$ |
| paraboloide $z=x^2+y^2$ sobre $\rho\le R$ | $\sqrt{1+4\rho^2}\,\rho\,d\rho\,d\varphi$ | $\tfrac\pi6\big[(1+4R^2)^{3/2}-1\big]$ |

## 8 · Teóricos: los cuatro del plan (elegís UNO)

**T-A · Independencia de la trayectoria.** Hipótesis: $f=\nabla\varphi$ con $\varphi\in C^1$, y $\lambda:[a,b]\to$ dominio una curva $C^1$ con $\lambda(a)=A$, $\lambda(b)=B$. Tesis: $\int_\lambda f\cdot d\lambda=\varphi(B)-\varphi(A)$.
1. Definí $h(t)=\varphi(\lambda(t))$. Por regla de la cadena, $h'(t)=\nabla\varphi(\lambda(t))\cdot\lambda'(t)=f(\lambda(t))\cdot\lambda'(t)$.
2. Entonces $\int_\lambda f\cdot d\lambda=\int_a^b f(\lambda(t))\cdot\lambda'(t)\,dt=\int_a^b h'(t)\,dt$.
3. Por Barrow, $=h(b)-h(a)=\varphi(B)-\varphi(A)$. ∎ Consecuencia: si la curva es cerrada, $A=B$ y la integral es $0$.

**T-B · Green y la fórmula del área.** Enunciar con hipótesis ($f=(P,Q)\in C^1$ en $D$; $D$ región regular del plano; $\partial D$ cerrada simple, recorrida en sentido antihorario): $\oint_{\partial D}f\cdot d\lambda=\iint_D(Q_x-P_y)\,dA$. Deducción del área: elegí un campo con $Q_x-P_y=1$; entonces la integral doble es $\iint_D1\,dA=$ área$(D)$ y la circulación de ese campo es el área. Dos campos que sirven: $(0,x)$ y $(-y,0)$; promediándolos, $A=\tfrac12\oint(x\,dy-y\,dx)$. (Si piden "dos ejemplos y cómo los construyó", esto es exactamente eso.)

**T-C · Stokes.** Hipótesis: $f\in C^1$; $S$ superficie simple y orientable, con borde $\partial S$ curva regular simple; orientaciones coherentes (mano derecha: pulgar $=\hat n$, dedos $=\partial S$). Tesis: $\oint_{\partial S}f\cdot d\lambda=\iint_S\operatorname{rot}f\cdot\hat n\,dS$.

**T-D · Gauss.** Hipótesis: $f\in C^1$; $\Omega$ región simple del espacio (sólido encerrado por una superficie simple y orientable por partes) incluida en el dominio de $f$; $\partial\Omega$ orientada con normales **hacia afuera**. Tesis: $\oiint_{\partial\Omega}f\cdot\hat n\,dS=\iiint_\Omega\operatorname{div}f\,dV$. Pregunta que lo acompaña: "¿se puede aplicar en forma directa a una superficie abierta?" → **no**, no encierra región; hay que cerrarla (§1.4).

**Otros que cayeron y podés tener de reserva** (flashcards 8–13): definición de función potencial; condición necesaria de conservativo, $P_y=Q_x$, demostrada con Schwarz sobre $\varphi\in C^2$; enunciado del cambio de variables y deducción del jacobiano de polares $=\rho$; definición de punto regular de curva y de superficie (§4).

**Plan B (definiciones formales, sin apuntes en el repo — flashcards 25 y 26):** si un examen no trae ninguno de los cuatro, T2 suele ser "defina X" con X en {derivada direccional, diferenciabilidad, continuidad, máximo/mínimo local/absoluto, punto silla} más un caso concreto, que se resuelve con §5.5 o §6.

## 10 · OJO — errores que cuestan puntos

- **Elegir 3 y soltar 3.** Intentar los 6 es el error más caro del final: 2 horas no alcanzan y un ejercicio a medias vale $0$.
- **Escribí la orientación que elegiste** en todo flujo y toda circulación. Lo piden en casi todos los P.
- Green y Gauss dan **antihorario / saliente**; "sentido negativo", "normal con segunda componente negativa", "entrante" → signo $-$.
- Gauss no se aplica a superficie abierta ni si el campo tiene un punto no definido dentro del cuerpo.
- Flujo por gráfica $z=g$: $(-g_x,-g_y,1)$ apunta hacia arriba. Y **reemplazá $z=g(x,y)$ dentro del campo** antes del producto escalar.
- Si te dan $Df$ o $\operatorname{rot}f$ sin $f$: no intentes reconstruir $f$. Es Stokes, y las entradas de la diagonal no se usan.
- Jacobiano siempre: $\rho$ en polares y cilíndricas, $\rho^2\operatorname{sen}\theta$ en esféricas. En "área$(D^*)$" va $\lvert J\rvert$.
- $x^2+y^2\le2x$, $x^2+y^2=y$, $x^2-2x+y^2=0$ → **completá cuadrados antes de hacer nada**: son discos o cilindros corridos.
- Implícita: primero $z_0$, después las derivadas; verificá $F_z\ne0$. En la regla de la cadena, $\nabla f$ va evaluado en el **punto imagen**.
- Resonancia: mirá si el candidato ya está en $y_H$ **antes** de derivar. Las condiciones iniciales se aplican a $y_H+y_p$, nunca a $y_H$ sola.
- Trayectorias ortogonales: eliminar la constante **antes** de invertir la pendiente.
- Extremos: $D<0$ es silla, no "sin información". En una región cerrada, mirá la frontera siempre.
- V/F: un contraejemplo concreto vale tanto como una demostración; "Falso" sin justificar vale $0$.
