# Simulacro 01 — Segundo Parcial AM2

> Generado el 2026-07-05 · Duración: 2 horas · Resolver sin apuntes. Corregir al final y anotar errores con /registrar.

## P1)

Calcular la masa del cuerpo definido por `x² + y² + z² ≤ 8`, `z ≥ √(x² + y²)`, sabiendo que la densidad en cada punto es proporcional a la distancia del punto al plano `xy`.

<details><summary>Corrección P1</summary>

**Paso 1: identificar el cuerpo y la densidad.** Es el "cono de helado": esfera de radio `√8 = 2√2` cortada por el cono `z = √(x²+y²)`. La distancia de un punto al plano `xy` dentro de la región es `z` (allí `z ≥ 0`), así que

$$
\delta(x,y,z) = k\,z, \qquad k > 0 \ \text{constante}.
$$

**Paso 2: pasar a coordenadas esféricas.** Con `x = ρ\senφ\cosθ`, `y = ρ\senφ\senθ`, `z = ρ\cosφ`, `|J| = ρ²\senφ`:

- Esfera: `ρ ≤ 2√2`.
- Cono `z ≥ √(x²+y²)`: `ρ\cosφ ≥ ρ\senφ` ⟹ `0 ≤ φ ≤ π/4`.
- `θ ∈ [0, 2π]` (vuelta completa).

**Paso 3: plantear la integral de masa.**

$$
M = \int_0^{2\pi}\!\!\int_0^{\pi/4}\!\!\int_0^{2\sqrt{2}} k\,(\rho\cos\varphi)\,\rho^2\sin\varphi \;d\rho\,d\varphi\,d\theta
$$

**Paso 4: separar y calcular cada factor.**

$$
\int_0^{2\sqrt{2}} \rho^3\,d\rho = \frac{\rho^4}{4}\Big|_0^{2\sqrt{2}} = \frac{64}{4} = 16,
\qquad
\int_0^{\pi/4} \sin\varphi\cos\varphi\,d\varphi = \frac{\sin^2\varphi}{2}\Big|_0^{\pi/4} = \frac{1}{4}
$$

**Paso 5: multiplicar.**

$$
M = k \cdot 2\pi \cdot 16 \cdot \frac{1}{4} = 8\pi k
$$

**Resultado: M = 8πk** (con `k` la constante de proporcionalidad).

**Puntaje:** 25 pts — 10 planteo (esféricas + límites correctos, en especial `φ ≤ π/4`), 10 desarrollo (Jacobiano y las dos integrales), 5 resultado.

</details>

## P2)

Verificar que `f(x, y) = (2xy + 3y² + 1, x² + 6xy − 2)` es conservativo en `ℝ²`. Calcular su función potencial sabiendo que vale `5` en el punto `(1, 1)`, y evaluar dicho potencial en el punto `(2, 0)`.

<details><summary>Corrección P2</summary>

**Paso 1: verificar la condición de conservativo.** `f ∈ C¹(ℝ²)` con `ℝ²` simplemente conexo, así que basta chequear la igualdad de las derivadas cruzadas:

$$
\frac{\partial P}{\partial y} = \frac{\partial}{\partial y}\left(2xy + 3y^2 + 1\right) = 2x + 6y,
\qquad
\frac{\partial Q}{\partial x} = \frac{\partial}{\partial x}\left(x^2 + 6xy - 2\right) = 2x + 6y
$$

Coinciden en todo `ℝ²` ⟹ `f` es conservativo.

**Paso 2: integrar la primera componente respecto de `x`.**

$$
\varphi(x,y) = \int (2xy + 3y^2 + 1)\,dx = x^2 y + 3xy^2 + x + g(y)
$$

**Paso 3: derivar respecto de `y` e igualar a la segunda componente.**

$$
\frac{\partial \varphi}{\partial y} = x^2 + 6xy + g'(y) = x^2 + 6xy - 2 \;\Longrightarrow\; g'(y) = -2 \;\Longrightarrow\; g(y) = -2y + C
$$

$$
\varphi(x,y) = x^2 y + 3xy^2 + x - 2y + C
$$

**Paso 4: usar la condición `φ(1,1) = 5`.**

$$
\varphi(1,1) = 1 + 3 + 1 - 2 + C = 3 + C = 5 \;\Longrightarrow\; C = 2
$$

$$
\varphi(x,y) = x^2 y + 3xy^2 + x - 2y + 2
$$

**Paso 5: evaluar en `(2, 0)`.**

$$
\varphi(2,0) = 0 + 0 + 2 - 0 + 2 = 4
$$

**Resultado: φ(x,y) = x²y + 3xy² + x − 2y + 2, y φ(2,0) = 4.**

**Puntaje:** 25 pts — 8 planteo (verificación con hipótesis: C¹ + dominio simplemente conexo), 12 desarrollo (integración correcta con `g(y)` y ajuste de la constante), 5 resultado.

</details>

## P3)

Calcular el flujo de `f(x, y, z) = (y², z² + x², x²)` a través de la superficie `y = x` tal que `x² + y² + 2z² ≤ 2`. Indicar gráficamente la orientación elegida para la superficie.

<details><summary>Corrección P3</summary>

**Paso 1: identificar la superficie.** Es un trozo del plano `y = x` recortado por el elipsoide `x² + y² + 2z² ≤ 2`. Sustituyendo `y = x` en la desigualdad:

$$
x^2 + x^2 + 2z^2 \le 2 \;\Longrightarrow\; x^2 + z^2 \le 1
$$

O sea: en las variables `(x, z)` la sombra es el **disco unitario**.

**Paso 2: parametrizar.**

$$
\Sigma(x,z) = (x,\; x,\; z), \qquad (x,z) \in D = \{x^2 + z^2 \le 1\}
$$

**Paso 3: vector normal.**

$$
\Sigma_x \times \Sigma_z = (1,1,0) \times (0,0,1) = (1,\,-1,\,0)
$$

Orientación elegida: normal que apunta hacia `x⁺, y⁻` (hacia el semiespacio `y < x`). Notar que `‖(1,−1,0)‖ = √2` ya incluye el elemento de área.

**Paso 4: evaluar `f` sobre la superficie y hacer el producto escalar.** Con `y = x`:

$$
f(\Sigma(x,z)) = (x^2,\; z^2 + x^2,\; x^2)
$$

$$
f \cdot (\Sigma_x \times \Sigma_z) = x^2 \cdot 1 + (z^2 + x^2)(-1) + x^2 \cdot 0 = -z^2
$$

**Paso 5: integrar sobre el disco (polares en el plano `xz`).**

$$
\Phi = \iint_D (-z^2)\,dA = -\int_0^{2\pi}\!\!\int_0^1 (r\sin\theta)^2\, r\,dr\,d\theta = -\int_0^{2\pi}\sin^2\theta\,d\theta \cdot \int_0^1 r^3\,dr = -\pi \cdot \frac{1}{4}
$$

**Resultado: Φ = −π/4** con la normal `(1, −1, 0)` (hacia `y < x`). Con la orientación opuesta, `Φ = π/4`.

**Puntaje:** 25 pts — 10 planteo (reducción a `x²+z² ≤ 1` + parametrización + normal explícita con orientación indicada), 10 desarrollo (producto escalar y polares), 5 resultado coherente con la orientación declarada.

</details>

## P4)

Resolver la ecuación diferencial `y'' − y' − 2y = 4x`, con las condiciones iniciales `y(0) = 0`, `y'(0) = 2`.

<details><summary>Corrección P4</summary>

**Paso 1: resolver la homogénea.** Ecuación característica:

$$
r^2 - r - 2 = 0 \;\Longrightarrow\; (r-2)(r+1) = 0 \;\Longrightarrow\; r_1 = 2,\; r_2 = -1
$$

Raíces reales y distintas:

$$
y_h = A\,e^{2x} + B\,e^{-x}
$$

**Paso 2: proponer solución particular (coeficientes indeterminados).** El término no homogéneo es un polinomio de grado 1 y `0` no es raíz de la característica, así que propongo `y_p = ax + b`:

$$
y_p'' - y_p' - 2y_p = 0 - a - 2(ax + b) = -2ax + (-a - 2b) = 4x
$$

Igualando coeficientes: `−2a = 4 ⟹ a = −2`, y `−a − 2b = 0 ⟹ 2 − 2b = 0 ⟹ b = 1`.

$$
y_p = -2x + 1
$$

**Paso 3: solución general.**

$$
y = A\,e^{2x} + B\,e^{-x} - 2x + 1
$$

**Paso 4: aplicar las condiciones iniciales.**

$$
y(0) = A + B + 1 = 0 \;\Longrightarrow\; A + B = -1
$$

$$
y' = 2A\,e^{2x} - B\,e^{-x} - 2 \;\Longrightarrow\; y'(0) = 2A - B - 2 = 2 \;\Longrightarrow\; 2A - B = 4
$$

Sumando las dos ecuaciones: `3A = 3 ⟹ A = 1`, y entonces `B = −2`.

**Paso 5: verificar.** `y(0) = 1 − 2 + 1 = 0` ✓ y `y'(0) = 2 + 2 − 2 = 2` ✓.

**Resultado: y(x) = e^{2x} − 2e^{−x} − 2x + 1.**

**Puntaje:** 25 pts — 8 planteo (característica + propuesta correcta de `y_p`), 12 desarrollo (coeficientes indeterminados + sistema de condiciones iniciales), 5 resultado.

</details>

## T1)

Enunciar el Teorema de Green (hipótesis y tesis). Calcular la circulación de `f(x, y) = (xy², 4x²y)` a lo largo de la frontera de la región `x² ≤ y ≤ x`, indicando el sentido de recorrido elegido.

<details><summary>Corrección T1</summary>

**Paso 1: enunciado del teorema.** Sea `D ⊂ ℝ²` una región compacta cuya frontera `C = ∂D` es una curva cerrada, simple, suave a trozos, recorrida en **sentido positivo** (antihorario: la región queda a la izquierda). Sea `f = (P, Q)` un campo de clase `C¹` en un abierto que contiene a `D`. Entonces:

$$
\oint_{C^+} P\,dx + Q\,dy = \iint_D \left( \frac{\partial Q}{\partial x} - \frac{\partial P}{\partial y} \right) dx\,dy
$$

**Paso 2: describir la región.** `x² ≤ y ≤ x` exige `x² ≤ x`, o sea `0 ≤ x ≤ 1`: región entre la parábola `y = x²` (abajo) y la recta `y = x` (arriba), con vértices `(0,0)` y `(1,1)`. Elijo el sentido **antihorario** (positivo): por la parábola de `(0,0)` a `(1,1)` y vuelta por la recta.

**Paso 3: calcular el integrando de Green.**

$$
\frac{\partial Q}{\partial x} - \frac{\partial P}{\partial y} = \frac{\partial}{\partial x}(4x^2 y) - \frac{\partial}{\partial y}(xy^2) = 8xy - 2xy = 6xy
$$

**Paso 4: integrar sobre la región.**

$$
\oint_{C^+} f \cdot d\lambda = \int_0^1\!\!\int_{x^2}^{x} 6xy \;dy\,dx = \int_0^1 3x\left(y^2\Big|_{x^2}^{x}\right) dx = \int_0^1 3x\,(x^2 - x^4)\,dx
$$

$$
= \int_0^1 (3x^3 - 3x^5)\,dx = \frac{3}{4} - \frac{3}{6} = \frac{3}{4} - \frac{1}{2} = \frac{1}{4}
$$

**Resultado: circulación = 1/4** recorriendo la frontera en sentido antihorario (positivo). En sentido horario da `−1/4`.

**Puntaje:** 12,5 pts — 5 enunciado completo (hipótesis: C¹, curva cerrada simple, orientación positiva; tesis), 5 desarrollo (región + integral doble), 2,5 resultado con el sentido indicado.

</details>

## T2)

Enunciar el teorema de cambio de variables para integrales dobles. Dada la integral

$$
\int_0^{\pi/2} \int_0^{2\sin\varphi} \rho^3 \;d\rho\,d\varphi
$$

(expresada en coordenadas polares), graficar la región de integración en el plano `xy` y expresar la integral en coordenadas cartesianas.

<details><summary>Corrección T2</summary>

**Paso 1: enunciado del teorema.** Sea `T: D* → D`, `(u,v) ↦ (x(u,v), y(u,v))`, una transformación biyectiva de clase `C¹` con Jacobiano `J = ∂(x,y)/∂(u,v) ≠ 0` en el interior de `D*`. Si `g` es integrable en `D`, entonces:

$$
\iint_D g(x,y)\,dx\,dy = \iint_{D^*} g\big(x(u,v),\,y(u,v)\big)\,\big|J(u,v)\big|\,du\,dv
$$

**Paso 2: identificar la curva `ρ = 2 sen φ`.** Multiplicando por `ρ`: `ρ² = 2ρ senφ`, es decir

$$
x^2 + y^2 = 2y \;\Longleftrightarrow\; x^2 + (y-1)^2 = 1
$$

Circunferencia de centro `(0, 1)` y radio `1`. Como `φ ∈ [0, π/2]` y `ρ ∈ [0, 2senφ]`, se barre solo la parte con `x ≥ 0`.

**Paso 3: graficar la región.** Semidisco derecho del círculo `x² + (y−1)² ≤ 1`: apoyado en el origen, tangente al eje `x`, con el diámetro sobre el eje `y` (de `(0,0)` a `(0,2)`) y la mitad curva hacia `x > 0`.

**Paso 4: traducir el integrando.** En polares `dx dy = ρ dρ dφ`, así que

$$
\rho^3\,d\rho\,d\varphi = \rho^2 \cdot \rho\,d\rho\,d\varphi \;\longrightarrow\; (x^2 + y^2)\,dx\,dy
$$

**Paso 5: describir la región en cartesianas.** De `x² + y² ≤ 2y` con `x ≥ 0`: para cada `y ∈ [0, 2]`, `x` va de `0` a `√(2y − y²)`:

$$
\int_0^{\pi/2}\!\!\int_0^{2\sin\varphi} \rho^3\,d\rho\,d\varphi = \int_0^2\!\!\int_0^{\sqrt{2y - y^2}} (x^2 + y^2)\;dx\,dy
$$

(Equivalente con el otro orden: `x ∈ [0,1]`, `y` entre `1 − √(1−x²)` y `1 + √(1−x²)`.)

**Verificación (opcional):** en polares la integral vale `∫₀^{π/2} (2senφ)⁴/4 dφ = 4∫₀^{π/2} sen⁴φ dφ = 4 · 3π/16 = 3π/4`.

**Resultado: región = semidisco `x² + (y−1)² ≤ 1`, `x ≥ 0`; integral = ∫₀² ∫₀^{√(2y−y²)} (x²+y²) dx dy = 3π/4.**

**Puntaje:** 12,5 pts — 4 enunciado del teorema (con hipótesis del Jacobiano), 4 gráfico correcto de la región (circunferencia `x²+y²=2y`, mitad `x ≥ 0`), 4,5 pasaje correcto a cartesianas (integrando `x²+y²` + límites).

</details>
