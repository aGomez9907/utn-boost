## Las tres esferas de actuación del gerente según Mintzberg — [unidad V, p. 36–43]

Mintzberg agrupa los papeles (roles) que desempeña un gerente en **tres esferas de actuación**, cada una con sus papeles:

| Esfera | Qué la define | Papeles |
|---|---|---|
| **Interpersonal** | El gerente como figura directiva, representante de su unidad | Representante · Líder · Enlace |
| **Informacional** | El gerente como foco central de la información de la empresa | Monitor · Difusor (diseminador) · Portavoz (vocero) |
| **Decisional** | El gerente como tomador de decisiones | Emprendedor · Árbitro (manejador de conflictos) · Administrador de recursos · Negociador |

- Las caracterizaciones de cada esfera ("figura directiva", "foco central de la información", "toma de decisiones") salen de la respuesta de parcial del 2018-05-02.
- En el parcial la cátedra pide **una esfera a elección** (rotó: interpersonal en 2019 y en la foto sin fecha, informacional en 2014, decisional en 2014 y 2018). Conviene saber las tres con todos sus papeles y, aunque pregunten una sola, tener claro el mapa completo.

## Esfera interpersonal: representante, líder, enlace — [unidad V, p. 36–43]

### Representante (figura directiva)

- Desempeña funciones como **cabeza de su unidad**, incluyendo papeles **simbólicos y ceremoniales**.
- Lo hace tanto ante los miembros de la organización como ante los observadores externos.
- **Personifica los aciertos y fracasos** de su unidad.

### Líder

- Este papel es inherente a su carácter de **responsable del trabajo de su gente**. Algunas tareas implican liderazgo directo.
- **Coordina, dirige y motiva** a sus colaboradores.
- Debe **conciliar los objetivos personales** de cada uno **con los de la organización**.
- Mientras que la autoridad formal le da una cantidad de poder, el **liderazgo legitimado determina en gran medida cuánto de ese poder puede usar**.

### Enlace

- Los administradores "deben aprender a trabajar dentro o fuera de la organización" con quienquiera que pueda ayudarles al logro de sus objetivos.
- Establece **contactos fuera de su línea vertical de mando**. Está probado que los gerentes usan tanto tiempo con sus subordinados como con otros colegas y personas ajenas a sus unidades.
- Forman **redes de obligaciones recíprocas** (dentro y fuera), forman **coaliciones** y se apoyan en sus relaciones para lograr cooperación.
- En sentido más formal, son quienes **conectan a la empresa (o a su departamento) con el entorno**.

- **Representante:** desempeña funciones como cabeza de su unidad, incluyendo papeles simbólicos o ceremoniales. Tanto ante los miembros de la organización como ante los observadores externos, personifica los aciertos y fracasos de aquélla.

- **Enlace:** los administradores "deben aprender a trabajar dentro o fuera de la organización" con quienquiera que pueda ayudarles al logro de sus objetivos. El gerente establece contactos fuera de su línea vertical de mando. Está probado que los gerentes utilizan tanto tiempo con sus subordinados como con otros colegas y personas ajenas a sus unidades. Forman redes de obligaciones recíprocas (dentro y fuera), forman coaliciones, se apoyan en sus relaciones para lograr cooperación. En sentido más formal, son quienes conectan a la empresa o a su departamento con el entorno.

## Esfera informacional: monitor, difusor, portavoz — [unidad V, p. 36–43]

El gerente es el **foco central de la información de la empresa**: la busca (monitor), la reparte hacia adentro (difusor) y la transmite hacia afuera (portavoz).

### Monitor

- Hace una **permanente búsqueda, examen y seguimiento de informaciones del ambiente externo**, ya sea mediante requerimientos a sus subordinados o a otros enlaces.
- Recibe gran cantidad de **información no solicitada**, sobre todo a través de **redes de contactos, tanto formales como extraoficiales, que él mismo ha desarrollado**.

### Difusor o diseminador

- Debe **compartir gran parte de esa información**.
- Los informes que recaba de los contactos externos pueden ser necesarios dentro de la organización.
- En su papel de diseminador debe **distribuir y divulgar la información relevante para sus subordinados**: la que ellos necesitan para tomar decisiones acertadas y alcanzar un desempeño eficaz de sus propias funciones.

### Portavoz o vocero

- Actuando como vocero de su unidad, **transmite parte de su información a terceros, fuera de su unidad, particularmente a sus superiores**.
- Debe informar a las **personas influyentes que controlan su unidad**.
- Igual que los diplomáticos, se guía por **lo que conviene a su empresa y a su área**.

## Esfera decisional: emprendedor, árbitro, administrador de recursos, negociador — [unidad V, p. 36–43]

La esfera de la **toma de decisiones**. Son cuatro papeles (la esfera con más papeles).

### Emprendedor (estratega)

- Es el **estratega y creador de negocios por excelencia**.
- Debe ser capaz de **iniciar cambios** cuando su conocimiento de la organización y del ambiente le indique la necesidad de producirlos.
- El gerente de una unidad trata de **mejorarla y adaptarla a las condiciones cambiantes del medio**.
- Está en **constante sondeo en busca de nuevas ideas**.

### Árbitro (manejador de conflictos)

- Debe **manejar y resolver los problemas y conflictos**, de manera de mantener la **estabilidad interna**.
- Debe ser capaz de **pensar analítica y conceptualmente**, y **prever las implicaciones de las decisiones** que adopte.
- Debe **afrontar las perturbaciones**, respondiendo a las presiones, que a veces son demasiado enormes como para ignorarlas: cuando hace caso omiso, éstas pueden terminar generando una **crisis**.

### Administrador de recursos

- Tiene la responsabilidad de decidir **"qué se le dará a cada uno dentro de la unidad y cómo dividirá el trabajo"**.
- Se asegura de que las decisiones estén en **sincronismo con los recursos asignados**.
- Dado que hay gran cantidad de objetivos y metas, los respectivos responsables bajo su mando **compiten por los recursos** (materiales y humanos).
- Las **definiciones de prioridades** que comporta este rol son, casi siempre, la **expresión concreta de la verdadera política de un gerente**.

### Negociador

- Para los gerentes, las negociaciones son **una forma de vida**: son quienes cuentan con los **conocimientos y las facultades** necesarias para hacerlo y tienen la **autoridad para comprometer los recursos** de la organización o de su unidad.

Según Mintzberg: ¿cuáles son los roles de la esfera de actuación decisional?

<details>
<summary>Ver respuesta (del compilado)</summary>

La respuesta del compilado recorre las tres esferas antes de llegar a la pedida. Para Mintzberg las esferas de actuación son:

- **Interpersonal** (figura directiva, representante). Como **representante** tiene actividades de ceremonial: el gerente personifica los aciertos y fracasos. Como **líder** es el responsable del trabajo; sus objetivos individuales son los organizacionales. Y como **enlace** forma las coaliciones, redes.
- **Informacional** (siendo el foco central de la información de la empresa). Como **monitor** realiza las búsquedas, exámenes y seguimiento de la información. Como **difusor** divulga la información a los subordinados y como **portavoz** transmite esa información a los terceros.
- **Decisional** (toma de decisiones). Siendo **emprendedor o estratega**, **árbitro** para manejar conflictos, **administrador** asignando el trabajo y sincronizando recursos y, por último, **negociador**.

</details>

## Habilidades de los gerentes: conceptuales, técnicas, humanas — [unidad V, p. 36–43]

- **Conceptuales:** implican tener **visión de la complejidad del todo**. Es la **capacidad de abstraer lo esencial** que subyace en un conjunto de situaciones particulares. Por ejemplo, comprender las complejas relaciones existentes entre las unidades a su cargo, o descubrir las direcciones hacia las que tienden los mercados de su empresa.
- **Técnicas:** comprenden el **conocimiento, procedimientos y recursos que se aplican en un determinado campo de especialización**, como ser la ingeniería, el cómputo, la contabilidad, la producción material o de servicios, etc.
- **Humanas:** residen en la **capacidad de interactuar y trabajar bien con otras personas**, ya sea de manera individual o en grupo; **motivar** y **resolver problemas interpersonales**.

*(la relación con el nivel de la estructura no está desarrollada en las fuentes)*
