## Estímulo vs. motivación — [unidad VIII, p. 59–65]

Son dos cosas distintas y conviene tener clara la diferencia antes de entrar en las teorías:

- **Estímulo:** es un **hecho objetivo de la realidad** que circunda al hombre: necesidades materiales (propias o de la familia), el pago, las exigencias sociales. Es un **impulso exterior**.
- **Motivación:** es el **reflejo del estímulo en la consciencia** del individuo, con mayor o menor fuerza. Es un **impulso interior**.
- Definición alternativa de motivación: **proceso dinámico que se manifiesta en la conducta del individuo por la intención y la acción hacia la satisfacción de necesidades**.

En resumen: el estímulo está afuera (objetivo), la motivación está adentro (subjetiva) y es la que efectivamente dirige la conducta.

## Teoría de Maslow — [unidad VIII, p. 59–65]

Idea central: **en la medida en que el hombre satisface sus necesidades básicas, otras más elevadas toman predominio del comportamiento.** Las necesidades se ordenan en una jerarquía (pirámide), de la más baja a la superior.

### Los cinco niveles (de abajo hacia arriba)

1. **Necesidades fisiológicas:** aire, comida, reposo, abrigo, etc.
2. **Necesidades de seguridad:** protección contra el peligro o la privación.
3. **Necesidades sociales:** amistad, ingreso a grupos, etc.
4. **Necesidades de estimación (estima):** reputación, reconocimiento, auto-respeto, amor, etc.
5. **Necesidades de auto-realización:** realización del potencial, utilización plena del talento individual, etc.

### Necesidades primarias y secundarias — [parcial 2018-05-02]

- **Primarias:** las **fisiológicas** y las **de seguridad**. Están enfocadas hacia la **conservación personal**.
- **Secundarias:** las **sociales**, las **de estimación** y las **de auto-realización**.

### Una necesidad satisfecha no motiva

- **Una necesidad satisfecha no es motivadora de comportamiento.**
- **Solo las necesidades no satisfechas** influyen sobre el comportamiento, dirigiéndolo hacia objetivos individuales.

Esta es la regla que explica el "ascenso" en la pirámide: cuando un nivel queda cubierto deja de empujar la conducta, y pasa a mandar el nivel siguiente.

### Qué sucede al satisfacer cada nivel

Es la pregunta más repetida en los parciales (cae como "qué sucede cuando se supera un nivel" o "qué pasa con cada escala cuando es satisfecha"). Nivel por nivel:

- **Fisiológicas (punto de partida):** el individuo **nace** con un cierto contenido de necesidades fisiológicas, que son **innatas o hereditarias**. De inicio, el comportamiento se enfoca **exclusivamente** hacia la satisfacción de necesidades como el hambre, la sed, el ciclo sueño-actividad, el sexo, etc.
- **Al satisfacer las fisiológicas → surgen las de seguridad:** a partir de ahí el individuo ingresa en una **larga trayectoria de aprendizaje de nuevos patrones de necesidades**. Surgen las necesidades de seguridad, enfocadas hacia la protección contra el peligro, las amenazas y la privación. Fisiológicas + seguridad = **necesidades primarias**, orientadas a la conservación personal.
- **Al controlar las fisiológicas y las de seguridad → surgen las secundarias:** a medida que el individuo pasa a controlar sus necesidades primarias, surgen **lenta y gradualmente** las necesidades secundarias: sociales, de estima y de auto-realización.
- **Al satisfacer las sociales → surgen las de estima:** cuando el individuo alcanza la satisfacción de las necesidades sociales, aparecen las necesidades de estima. Por eso las de estima son **complementarias** a las sociales.
- **Al alcanzar las de estima → surgen las de auto-realización:** solo cuando las de estima son alcanzadas surgen las de auto-realización. Estas **solamente aparecen cuando los niveles más bajos están relativamente controlados** y fueron alcanzados por el individuo.
- **Aclaración final:** **no todos los individuos logran llegar** al nivel de auto-realización, ni siquiera al nivel de estima.

- **Necesidades fisiológicas:** aire, comida, reposo, abrigo, etc.
- **Necesidades de seguridad:** protección contra el peligro o privación.
- **Necesidades sociales:** amistad, ingreso a grupos, etc.

## Teoría de Herzberg — [unidad VIII, p. 59–65]

Herzberg separa los factores que actúan sobre la motivación en dos tipos, con efectos **asimétricos**: unos solo evitan la desmotivación, los otros son los que realmente motivan.

### Factor higiénico o de mantenimiento

- Se relaciona con la **subsistencia y la seguridad**.
- Hipótesis: **su insatisfacción es causa de desmotivación**, pero **su satisfacción no motiva**: solo **elimina la desmotivación**.

### Factor motivador

- Está vinculado a la **autoestima, el prestigio y la realización plena**.
- Es **altamente motivador cuando se satisface**, y **la ausencia de su satisfacción no llega a desmotivar**: solo **priva de motivación**.

### Las dos zonas de satisfacción según Herzberg — [parcial 2015-11-19]

El compilado lo formula así: en las personas se descubren **dos zonas de satisfacción o motivación**:

- **En la tarea en sí misma:** se relaciona con **estímulos dinamizadores de su conducta**: sentido de responsabilidad, necesidad de prestigio y de realización.
- **Provista por elementos periféricos:** salario, beneficios sociales, control, normas del grupo.

Para cruzar las dos fuentes: "prestigio" y "realización" aparecen tanto en la zona de la tarea en sí (compilado) como en el factor motivador (doc de finales); salario y beneficios sociales, en cambio, apuntan a subsistencia y seguridad, que es lo que el doc de finales describe como factor higiénico.

| | Factor higiénico / de mantenimiento | Factor motivador |
|---|---|---|
| Se relaciona con | subsistencia y seguridad | autoestima, prestigio, realización plena |
| Ejemplos (compilado) | salario, beneficios sociales, control, normas del grupo (elementos periféricos) | sentido de responsabilidad, prestigio, realización (la tarea en sí) |
| Si está insatisfecho | **desmotiva** | no desmotiva, solo **priva de motivación** |
| Si está satisfecho | **no motiva**, solo elimina la desmotivación | **motiva fuertemente** |

## Frustración laboral — [unidad VIII, p. 59–65]

Frente a la frustración laboral, el individuo puede reaccionar con dos tipos de conducta:

- **Conducta adaptada.**
- **Conducta inadaptada o enferma**, que toma alguna de estas formas:
  - **Agresión hacia el causante.**
  - **Regresión.**
  - **Fijación.**
  - **Proyección.**
  - **Desinterés fingido.**

La fuente solo enumera las formas, sin desarrollarlas: para el parcial alcanza con saber la división adaptada / inadaptada y las cinco conductas inadaptadas.

## Herramientas del gerente para motivar — [unidad VIII, p. 59–65]

El gerente tiene cuatro herramientas para motivar al personal:

### Comunicación

- Una **política de comunicación bidireccional** es una necesidad para elevar la moral y la motivación del personal.
- Se suelen alzar **obstáculos** en el camino de esa política, cuyo origen puede estar tanto en el **superior** como en el **subordinado**.
- Pero la **responsabilidad central** de una buena comunicación **es siempre del superior**.

### Planeamiento

- Puede enfocarse solo como un **proceso gerencial** de determinación de objetivos y asignación de recursos, o también como un **factor de motivación** sobre la conducta de los empleados.
- Los **métodos participativos de planeamiento**, por su carácter inclusivo, motivan al personal: al haber contribuido a su trazado, el personal se **involucra en mayor medida en la responsabilidad** por el cumplimiento de las metas.

### Supervisión

- Los estilos llamados de **"supervisión general"** o **"de desarrollo"** se orientan a proporcionar oportunidades al subordinado para que **goce haciendo una buena labor** y obtenga una **auténtica satisfacción** con la realización de su trabajo.
- Medios que utiliza:
  - la **participación** del personal;
  - la **rotación de puestos**;
  - la **reestructuración y enriquecimiento de las tareas**;
  - **procedimientos de control** más atentos a los **resultados en horizontes extendidos** que a la vigilancia diaria.

### Recompensa

- Es uno de los **más importantes medios de motivación**.
- Abarca desde la forma de asignar **remuneraciones fijas e incentivos variables** (dirigidos a satisfacer necesidades **fisiológicas y de seguridad**) hasta las recompensas que refuerzan la **autoestima, el prestigio social y la autorrealización**: premios, ascensos, capacitación, posibilidad de desarrollar una carrera, etc.
- Nota para relacionar con Maslow: las remuneraciones cubren los niveles bajos de la pirámide; premios, ascensos y carrera apuntan a los niveles de estima y auto-realización.
