# Apuntes de Clase: Momentos, Baricentros y Momentos de Inercia

## PARTE 1 — TEORÍA

### Momentos Estáticos (de Primer Orden) — [00:00](https://www.youtube.com/watch?v=v6XSV4ohEtY&t=0s)

Dada una región de integración $D$ en el plano $xy$, se definen los momentos estáticos o de primer orden de la siguiente manera:

-   **Momento estático respecto al eje x ($M_x$)**: Es la integral doble sobre la región $D$ de la función $y$.

$$
M_x = \iint_D y \,dx\,dy
$$

-   **Momento estático respecto al eje y ($M_y$)**: Es la integral doble sobre la región $D$ de la función $x$.

$$
M_y = \iint_D x \,dx\,dy
$$

### Baricentro (Centroide) — [15:09](https://www.youtube.com/watch?v=v6XSV4ohEtY&t=909s)

El baricentro o centroide de una región plana $D$, denotado como $G = (x_g, y_g)$, es un punto cuyas coordenadas se definen a partir de los momentos estáticos y el área de la región.

-   **Coordenada x del baricentro ($x_g$)**: Es el cociente entre el momento estático respecto al eje $y$ y el área de la región $D$.

$$
x_g = \frac{M_y}{A_D} = \frac{\iint_D x \,dx\,dy}{\iint_D \,dx\,dy}
$$

-   **Coordenada y del baricentro ($y_g$)**: Es el cociente entre el momento estático respecto al eje $x$ y el área de la región $D$.

$$
y_g = \frac{M_x}{A_D} = \frac{\iint_D y \,dx\,dy}{\iint_D \,dx\,dy}
$$

#### Propiedad fundamental del baricentro — [35:03](https://www.youtube.com/watch?v=v6XSV4ohEtY&t=2103s)

El momento estático de una región $D$ respecto a cualquier eje que pase por su baricentro es siempre igual a cero.

Si un eje, por ejemplo el eje $x$, pasa por el baricentro de la sección, entonces la coordenada $y_g$ es cero. De la definición de $y_g$, se deduce que:

$$
0 = \frac{M_x}{A_D} \implies M_x = 0
$$

### Momentos de Inercia (de Segundo Orden) — [38:48](https://www.youtube.com/watch?v=v6XSV4ohEtY&t=2328s)

Los momentos de segundo orden, comúnmente conocidos como **momentos de inercia**, se definen multiplicando el integrando por el cuadrado de la distancia a un eje o punto.

-   **Momento de inercia respecto al eje x ($I_x$)**:

$$
I_x = \iint_D y^2 \,dx\,dy
$$

-   **Momento de inercia respecto al eje y ($I_y$)**:

$$
I_y = \iint_D x^2 \,dx\,dy
$$

-   **Momento de inercia polar ($I_p$ o $I_0$)**: Se calcula respecto al origen de coordenadas.

$$
I_p = \iint_D (x^2 + y^2) \,dx\,dy = \iint_D \rho^2 \,dA
$$

-   **Momento centrífugo o producto de inercia ($I_{xy}$)**:

$$
I_{xy} = \iint_D xy \,dx\,dy
$$

A partir de las propiedades de la integral, se puede demostrar fácilmente que el momento de inercia polar es la suma de los momentos de inercia respecto a los ejes $x$ e $y$:

$$
I_p = I_x + I_y
$$

### Teorema de Steiner (o de los ejes paralelos) — [58:43](https://www.youtube.com/watch?v=v6XSV4ohEtY&t=3523s)

Este teorema permite calcular el momento de inercia de una sección respecto a un eje arbitrario, conociendo el momento de inercia respecto a un eje paralelo que pasa por el baricentro de la sección.

**Hipótesis:**
-   Se conoce el momento de inercia $I_{x_g}$ de una región $D$ respecto a un eje $x_g$ que pasa por su baricentro.
-   Se quiere calcular el momento de inercia $I_x$ respecto a un eje $x$ paralelo a $x_g$.
-   La distancia perpendicular entre ambos ejes es $d$.

**Tesis:**
El momento de inercia respecto al eje arbitrario $x$ es igual al momento de inercia respecto al eje baricéntrico $x_g$ más el producto del área de la región por el cuadrado de la distancia entre los ejes.

$$
I_x = I_{x_g} + A_D \cdot d^2
$$

### Aplicaciones a Placas con Densidad Variable — [1:07:22](https://www.youtube.com/watch?v=v6XSV4ohEtY&t=4042s)

Si una región plana $D$ representa una placa con una densidad superficial variable, descrita por una función $\rho(x, y)$, las definiciones anteriores se generalizan incluyendo esta función en el integrando.

-   **Masa ($M$)**:

$$
M = \iint_D \rho(x, y) \,dx\,dy
$$

-   **Momentos estáticos**:
    -   $M_x = \iint_D y \cdot \rho(x, y) \,dx\,dy$
    -   $M_y = \iint_D x \cdot \rho(x, y) \,dx\,dy$

-   **Centro de masa (Baricentro)**:
    -   $x_g = \frac{M_y}{M}$
    -   $y_g = \frac{M_x}{M}$

-   **Momentos de inercia**:
    -   $I_x = \iint_D y^2 \cdot \rho(x, y) \,dx\,dy$
    -   $I_y = \iint_D x^2 \cdot \rho(x, y) \,dx\,dy$

## Ejercicios

<details>
<summary>📝 Ejercicio 1 — <a href="https://www.youtube.com/watch?v=v6XSV4ohEtY&t=67s">01:07</a>: Momento estático de un sector circular</summary>

Calcular el momento estático de primer orden de una región circular de radio $R$, tangente al eje $x$ en el origen, respecto a dicho eje.

La región $D$ está definida por:

$$
x^2 + (y-R)^2 \le R^2
$$

Se busca calcular el momento estático respecto al eje $x$:

$$
M_x = \iint_D y \,dx\,dy
$$

<details>
<summary>Ver resolución</summary>

**Paso 1:** Cambio a coordenadas polares.
Se utiliza la transformación $x = \rho \cos(\phi)$ e $y = \rho \sin(\phi)$, con un Jacobiano $|\boldsymbol{J}| = \rho$. El integrando $y$ se convierte en $\rho \sin(\phi)$.

**Paso 2:** Determinar los límites de integración para $\phi$.
La región se encuentra en el primer y segundo cuadrante, por lo que el ángulo $\phi$ varía entre $0$ y $\pi$.

**Paso 3:** Determinar los límites de integración para $\rho$.
Se sustituyen las coordenadas polares en la ecuación cartesiana de la circunferencia para hallar el límite superior de $\rho$.

$$
x^2 + y^2 - 2yR \le 0
$$

$$
\rho^2 - 2R\rho\sin(\phi) \le 0
$$

$$
\rho(\rho - 2R\sin(\phi)) \le 0
$$

Como $\rho \ge 0$, la condición se cumple si $\rho - 2R\sin(\phi) \le 0$. Por lo tanto, $\rho$ varía entre $0$ y $2R\sin(\phi)$.

**Paso 4:** Plantear la integral iterada.

$$
M_x = \int_{0}^{\pi} \int_{0}^{2R\sin(\phi)} (\rho\sin(\phi)) \cdot \rho \,d\rho\,d\phi = \int_{0}^{\pi} \int_{0}^{2R\sin(\phi)} \rho^2\sin(\phi) \,d\rho\,d\phi
$$

**Paso 5:** Integrar respecto a $\rho$.

$$
\int_{0}^{\pi} \sin(\phi) \left[ \frac{\rho^3}{3} \right]_{0}^{2R\sin(\phi)} \,d\phi = \int_{0}^{\pi} \sin(\phi) \frac{(2R\sin(\phi))^3}{3} \,d\phi
$$

$$
= \frac{8R^3}{3} \int_{0}^{\pi} \sin^4(\phi) \,d\phi
$$

**Paso 6:** Integrar respecto a $\phi$ usando una tabla.
La integral de $\sin^4(\phi)$ es:

$$
\frac{3}{8}\phi - \frac{\sin(2\phi)}{4} + \frac{\sin(4\phi)}{32}
$$

**Paso 7:** Evaluar la integral definida y obtener el resultado.

$$
M_x = \frac{8R^3}{3} \left[ \frac{3}{8}\phi - \frac{\sin(2\phi)}{4} + \frac{\sin(4\phi)}{32} \right]_{0}^{\pi}
$$

$$
M_x = \frac{8R^3}{3} \left( \left( \frac{3\pi}{8} - 0 + 0 \right) - (0 - 0 + 0) \right) = \frac{8R^3}{3} \cdot \frac{3\pi}{8}
$$

$$
M_x = \pi R^3
$$

</details>

</details>

<details>
<summary>📝 Ejercicio 2 — <a href="https://www.youtube.com/watch?v=v6XSV4ohEtY&t=971s">16:11</a>: Baricentro de un triángulo rectángulo</summary>

Determinar la coordenada $x$ del baricentro ($x_g$) de una región triangular rectangular con vértices en $(0,0)$, $(b,0)$ y $(0,h)$.

La fórmula a utilizar es:

$$
x_g = \frac{M_y}{A_D}
$$

<details>
<summary>Ver resolución</summary>

**Paso 1:** Calcular el área del triángulo.
El área de la región $D$ es inmediata:

$$
A_D = \frac{b \cdot h}{2}
$$

**Paso 2:** Calcular el momento estático $M_y$.

$$
M_y = \iint_D x \,dx\,dy
$$

**Paso 3:** Definir los límites de integración.
La variable $x$ varía entre $0$ y $b$. Para un $x$ dado, la variable $y$ varía entre $0$ y la recta que une los puntos $(b,0)$ y $(0,h)$. La ecuación de esta recta es:

$$
\frac{x}{b} + \frac{y}{h} = 1 \implies y = h \left(1 - \frac{x}{b}\right)
$$

**Paso 4:** Plantear y resolver la integral para $M_y$.

$$
M_y = \int_{0}^{b} \int_{0}^{h(1 - x/b)} x \,dy\,dx
$$

Integrando primero respecto a $y$:

$$
M_y = \int_{0}^{b} x \left[ y \right]_{0}^{h(1 - x/b)} \,dx = \int_{0}^{b} x \cdot h \left(1 - \frac{x}{b}\right) \,dx
$$

$$
M_y = h \int_{0}^{b} \left(x - \frac{x^2}{b}\right) \,dx
$$

Integrando respecto a $x$:

$$
M_y = h \left[ \frac{x^2}{2} - \frac{x^3}{3b} \right]_{0}^{b} = h \left( \frac{b^2}{2} - \frac{b^3}{3b} \right) = h \left( \frac{b^2}{2} - \frac{b^2}{3} \right)
$$

$$
M_y = h \left( \frac{3b^2 - 2b^2}{6} \right) = \frac{h b^2}{6}
$$

**Paso 5:** Calcular la coordenada $x_g$.

$$
x_g = \frac{M_y}{A_D} = \frac{h b^2 / 6}{b h / 2} = \frac{h b^2}{6} \cdot \frac{2}{bh} = \frac{b}{3}
$$

**Paso 6:** Conclusión.
La coordenada $x$ del baricentro es $b/3$. Por simetría del problema, se puede deducir que la coordenada $y$ del baricentro será $h/3$.

</details>

</details>

<details>
<summary>📝 Ejercicio 3 — <a href="https://www.youtube.com/watch?v=v6XSV4ohEtY&t=1557s">25:57</a>: Baricentro de un semicírculo</summary>

Calcular las coordenadas del baricentro $(x_g, y_g)$ de la región $D$ encerrada por un semicírculo de radio $R$ ubicado en el semiplano superior ($y \ge 0$) y centrado en el origen.

<details>
<summary>Ver resolución</summary>

**Paso 1:** Calcular $x_g$ por simetría.
La región $D$ es simétrica respecto al eje $y$. La función a integrar para $M_y$ es $f(x,y) = x$, que es una función antisimétrica respecto al eje $y$ (es decir, $f(-x,y) = -f(x,y)$). La integral de una función antisimétrica sobre una región simétrica es cero.

$$
M_y = \iint_D x \,dx\,dy = 0
$$

Por lo tanto:

$$
x_g = \frac{M_y}{A_D} = \frac{0}{A_D} = 0
$$

**Paso 2:** Calcular $y_g$.
La fórmula es $y_g = M_x / A_D$. El área de la región es la de medio círculo:

$$
A_D = \frac{\pi R^2}{2}
$$

**Paso 3:** Calcular el momento estático $M_x$ usando coordenadas polares.

$$
M_x = \iint_D y \,dx\,dy
$$

En polares, $y = \rho\sin(\phi)$ y $dA = \rho \,d\rho\,d\phi$.

**Paso 4:** Definir los límites de integración en polares.
-   El radio $\rho$ varía de $0$ a $R$.
-   El ángulo $\phi$ varía de $0$ a $\pi$.

**Paso 5:** Plantear y resolver la integral para $M_x$.

$$
M_x = \int_{0}^{\pi} \int_{0}^{R} (\rho\sin(\phi)) \cdot \rho \,d\rho\,d\phi = \int_{0}^{\pi} \sin(\phi) \,d\phi \cdot \int_{0}^{R} \rho^2 \,d\rho
$$

**Paso 6:** Resolver las integrales simples.

$$
\int_{0}^{\pi} \sin(\phi) \,d\phi = [-\cos(\phi)]_{0}^{\pi} = -(-1) - (-1) = 2
$$

$$
\int_{0}^{R} \rho^2 \,d\rho = \left[ \frac{\rho^3}{3} \right]_{0}^{R} = \frac{R^3}{3}
$$

$$
M_x = 2 \cdot \frac{R^3}{3} = \frac{2}{3}R^3
$$

**Paso 7:** Calcular la coordenada $y_g$.

$$
y_g = \frac{M_x}{A_D} = \frac{2R^3/3}{\pi R^2 / 2} = \frac{2R^3}{3} \cdot \frac{2}{\pi R^2} = \frac{4R}{3\pi}
$$

El baricentro se encuentra en $(0, \frac{4R}{3\pi})$.

</details>

</details>

<details>
<summary>📝 Ejercicio 4 — <a href="https://www.youtube.com/watch?v=v6XSV4ohEtY&t=2391s">39:51</a>: Momento de inercia de una sección rectangular</summary>

Calcular el momento de inercia de una sección rectangular de base $b$ y altura $h$ respecto a un eje baricéntrico y paralelo a su base (eje $x$).

La región $D$ está definida por $0 \le x \le b$ y $-h/2 \le y \le h/2$. Se busca calcular:

$$
I_x = \iint_D y^2 \,dx\,dy
$$

<details>
<summary>Ver resolución</summary>

**Paso 1:** Plantear la integral iterada con los límites definidos.

$$
I_x = \int_{0}^{b} \int_{-h/2}^{h/2} y^2 \,dy\,dx
$$

**Paso 2:** Integrar respecto a $y$.

$$
I_x = \int_{0}^{b} \left[ \frac{y^3}{3} \right]_{-h/2}^{h/2} \,dx
$$

**Paso 3:** Evaluar en los límites de $y$.

$$
\left[ \frac{y^3}{3} \right]_{-h/2}^{h/2} = \frac{(h/2)^3}{3} - \frac{(-h/2)^3}{3} = \frac{h^3/8}{3} - \frac{-h^3/8}{3} = \frac{h^3}{24} + \frac{h^3}{24} = \frac{2h^3}{24} = \frac{h^3}{12}
$$

**Paso 4:** Integrar la constante resultante respecto a $x$.

$$
I_x = \int_{0}^{b} \frac{h^3}{12} \,dx = \frac{h^3}{12} \int_{0}^{b} \,dx
$$

**Paso 5:** Evaluar y obtener el resultado final.

$$
I_x = \frac{h^3}{12} [x]_{0}^{b} = \frac{h^3}{12} \cdot b
$$

$$
I_x = \frac{bh^3}{12}
$$

</details>

</details>

<details>
<summary>📝 Ejercicio 5 — <a href="https://www.youtube.com/watch?v=v6XSV4ohEtY&t=2714s">45:14</a>: Momento de inercia de una sección circular</summary>

Calcular el momento de inercia de una sección circular de radio $R$ centrada en el origen, respecto a un eje baricéntrico (eje $x$).

La región $D$ es $x^2 + y^2 \le R^2$. Se busca calcular:

$$
I_x = \iint_D y^2 \,dx\,dy
$$

<details>
<summary>Ver resolución</summary>

**Paso 1:** Cambiar a coordenadas polares.
El integrando $y^2$ se convierte en $(\rho\sin(\phi))^2 = \rho^2\sin^2(\phi)$. El diferencial de área es $\rho \,d\rho\,d\phi$.

**Paso 2:** Definir los límites de integración.
-   El radio $\rho$ varía de $0$ a $R$.
-   El ángulo $\phi$ varía de $0$ a $2\pi$.

**Paso 3:** Plantear la integral y separar las variables.
Dado que el integrando es un producto de funciones de $\rho$ y $\phi$ y los límites son constantes, la integral doble se puede separar en un producto de dos integrales simples.

$$
I_x = \int_{0}^{2\pi} \int_{0}^{R} (\rho^2\sin^2(\phi)) \cdot \rho \,d\rho\,d\phi = \int_{0}^{2\pi} \sin^2(\phi) \,d\phi \cdot \int_{0}^{R} \rho^3 \,d\rho
$$

**Paso 4:** Resolver la integral en $\phi$ usando una tabla.
La integral de $\sin^2(\phi)$ es:

$$
\int \sin^2(\phi) \,d\phi = \frac{\phi}{2} - \frac{\sin(2\phi)}{4}
$$

Evaluando entre $0$ y $2\pi$:

$$
\left[ \frac{\phi}{2} - \frac{\sin(2\phi)}{4} \right]_{0}^{2\pi} = \left( \frac{2\pi}{2} - 0 \right) - (0 - 0) = \pi
$$

**Paso 5:** Resolver la integral en $\rho$.

$$
\int_{0}^{R} \rho^3 \,d\rho = \left[ \frac{\rho^4}{4} \right]_{0}^{R} = \frac{R^4}{4}
$$

**Paso 6:** Multiplicar los resultados.

$$
I_x = \pi \cdot \frac{R^4}{4} = \frac{\pi R^4}{4}
$$

**Paso 7:** Expresar el resultado en términos del diámetro $D$.
Sustituyendo $R = D/2$:

$$
I_x = \frac{\pi (D/2)^4}{4} = \frac{\pi D^4/16}{4} = \frac{\pi D^4}{64}
$$

</details>

</details>

<details>
<summary>📝 Ejercicio 6 — <a href="https://www.youtube.com/watch?v=v6XSV4ohEtY&t=4108s">1:08:28</a>: Masa de una placa con densidad variable</summary>

Calcular la masa de una placa plana cuya densidad es $\rho(x,y) = kx$, donde $k$ es una constante. La placa ocupa la región $D$ definida por la inecuación $x^2 + y^2 \le 2Rx$.

La fórmula para la masa es:

$$
M = \iint_D \rho(x,y) \,dA = \iint_D kx \,dx\,dy
$$

<details>
<summary>Ver resolución</summary>

**Paso 1:** Analizar la región de integración.
Completando cuadrados en la inecuación:

$$
x^2 - 2Rx + y^2 \le 0
$$

$$
(x^2 - 2Rx + R^2) + y^2 \le R^2
$$

$$
(x-R)^2 + y^2 \le R^2
$$

La región es un círculo de radio $R$ centrado en $(R, 0)$.

**Paso 2:** Cambiar a coordenadas polares.
La densidad $\rho = kx$ se convierte en $\rho = k\rho\cos(\phi)$. El diferencial de área es $\rho \,d\rho\,d\phi$.

**Paso 3:** Determinar los límites de integración.
-   Para el ángulo $\phi$: la región se encuentra en el primer y cuarto cuadrante, por lo que $\phi$ varía entre $-\pi/2$ y $\pi/2$.
-   Para el radio $\rho$: se sustituyen las coordenadas polares en la ecuación cartesiana:
    
    $$
    \rho^2 \le 2R(\rho\cos(\phi)) \implies \rho \le 2R\cos(\phi)
    $$
    
    Por lo tanto, $\rho$ varía entre $0$ y $2R\cos(\phi)$.

**Paso 4:** Plantear la integral iterada.

$$
M = \int_{-\pi/2}^{\pi/2} \int_{0}^{2R\cos(\phi)} (k\rho\cos(\phi)) \cdot \rho \,d\rho\,d\phi
$$

$$
M = k \int_{-\pi/2}^{\pi/2} \cos(\phi) \int_{0}^{2R\cos(\phi)} \rho^2 \,d\rho\,d\phi
$$

**Paso 5:** Integrar respecto a $\rho$.

$$
\int_{0}^{2R\cos(\phi)} \rho^2 \,d\rho = \left[ \frac{\rho^3}{3} \right]_{0}^{2R\cos(\phi)} = \frac{(2R\cos(\phi))^3}{3} = \frac{8R^3\cos^3(\phi)}{3}
$$

**Paso 6:** Sustituir y plantear la integral en $\phi$.

$$
M = k \int_{-\pi/2}^{\pi/2} \cos(\phi) \left( \frac{8R^3\cos^3(\phi)}{3} \right) \,d\phi = \frac{8kR^3}{3} \int_{-\pi/2}^{\pi/2} \cos^4(\phi) \,d\phi
$$

**Paso 7:** Integrar $\cos^4(\phi)$ usando una tabla y evaluar.
La integral de $\cos^4(\phi)$ es:

$$
\frac{3}{8}\phi + \frac{\sin(2\phi)}{4} + \frac{\sin(4\phi)}{32}
$$

Evaluando entre $-\pi/2$ y $\pi/2$:

$$
\left[ \frac{3}{8}\phi + \dots \right]_{-\pi/2}^{\pi/2} = \left( \frac{3}{8}\frac{\pi}{2} + 0 + 0 \right) - \left( \frac{3}{8}\frac{-\pi}{2} + 0 + 0 \right) = \frac{3\pi}{16} - (-\frac{3\pi}{16}) = \frac{6\pi}{16} = \frac{3\pi}{8}
$$

**Paso 8:** Calcular la masa final.

$$
M = \frac{8kR^3}{3} \cdot \frac{3\pi}{8} = k\pi R^3
$$
