# PARTE 1 — TEORÍA

## Divergencia de un campo vectorial [00:35](https://www.youtube.com/watch?v=LLxa2v7Pjoo&t=35s)

Dado un campo vectorial $\vec{F}: A \subseteq \mathbb{R}^3 \to \mathbb{R}^3$, con componentes $\vec{F} = (f_1, f_2, f_3)$ que dependen de las variables $x, y, z$, se define la **divergencia** de $\vec{F}$ como la suma de las derivadas parciales de cada función componente respecto de su variable correspondiente:

$$
\operatorname{div} \vec{F} = \frac{\partial f_1}{\partial x} + \frac{\partial f_2}{\partial y} + \frac{\partial f_3}{\partial z}
$$

Esta expresión se puede interpretar como el **producto escalar del operador nabla** $\nabla$ por el campo vectorial, lo que da lugar a la notación habitual:

$$
\operatorname{div} \vec{F} = \nabla \cdot \vec{F} = \left( \frac{\partial}{\partial x}, \frac{\partial}{\partial y}, \frac{\partial}{\partial z} \right) \cdot (f_1, f_2, f_3)
$$

## La divergencia como campo escalar [04:18](https://www.youtube.com/watch?v=LLxa2v7Pjoo&t=258s)

La divergencia de un campo vectorial **resulta ser un campo escalar**: a cada punto del espacio le asigna un valor numérico real.

Por ejemplo:

- Para $\vec{F} = (x, y, z)$:

$$
\operatorname{div} \vec{F} = \frac{\partial}{\partial x}(x) + \frac{\partial}{\partial y}(y) + \frac{\partial}{\partial z}(z) = 1 + 1 + 1 = 3
$$

En este caso la divergencia es constante (vale $3$ en todo punto, independiente de $x, y, z$).

- Para $\vec{F} = (x^3, y^3, z^3)$:

$$
\operatorname{div} \vec{F} = 3x^2 + 3y^2 + 3z^2 = 3(x^2 + y^2 + z^2)
$$

Acá la divergencia depende del punto del espacio considerado.

## Campos solenoidales [12:47](https://www.youtube.com/watch?v=LLxa2v7Pjoo&t=767s)

Cuando la divergencia de un campo vectorial es **cero en todo punto**, el campo se denomina **solenoidal**:

$$
\operatorname{div} \vec{F} = 0
$$

- Es una característica de los campos eléctricos generados por solenoides (bobinas).
- En el caso de campos de velocidades de líquidos, cuando la divergencia es cero se dice que el campo es **incompresible**.

## Región simple del espacio [13:54](https://www.youtube.com/watch?v=LLxa2v7Pjoo&t=834s)

Una **región simple del espacio** (en $\mathbb{R}^3$) es una región de integración sólida —donde se podrían resolver integrales triples— cuya frontera está formada por **superficies simples y orientables por partes**.

Intuitivamente, es un sólido tal que todo su borde es una superficie simple y orientable por partes. Por ejemplo, un dado (cubo macizo): sus seis caras son seis trozos de plano que, unidos, forman una superficie simple y orientable por partes que encierra a la región sólida.

## Orientación positiva de la frontera [16:00](https://www.youtube.com/watch?v=LLxa2v7Pjoo&t=960s)

La frontera de una región simple de $\mathbb{R}^3$ se considera **orientada en forma positiva** cuando sus vectores normales apuntan **hacia el exterior** de la región.

Por ejemplo, para una superficie esférica que encierra una región del espacio, la frontera está orientada en forma positiva si los vectores normales apuntan hacia afuera de la región encerrada.

## Teorema de la Divergencia [17:32](https://www.youtube.com/watch?v=LLxa2v7Pjoo&t=1052s)

Permite calcular el flujo de un campo vectorial a través de una superficie cerrada relacionándolo con una integral triple sobre el sólido que encierra.

**Hipótesis:**
- $\vec{F}$ es un campo vectorial definido en $A \subseteq \mathbb{R}^3 \to \mathbb{R}^3$, de **clase $C^1$** (cada función componente tiene derivadas parciales respecto de cada una de las tres variables).
- $\Omega$ es una **región simple del espacio** incluida en el dominio del campo (de modo que $\vec{F}$ puede evaluarse en cualquier punto de $\Omega$).
- $\partial\Omega$ es la superficie frontera de $\Omega$, orientada en forma positiva (normales hacia el exterior).

**Tesis:** El flujo de $\vec{F}$ a través de la superficie cerrada $\partial\Omega$ es igual a la integral triple de la divergencia de $\vec{F}$ extendida a la región $\Omega$:

$$
\oiint_{\partial\Omega} \vec{F} \cdot d\vec{S} = \iiint_{\Omega} \operatorname{div} \vec{F} \,dx\,dy\,dz
$$

El círculo en la integral indica que la superficie es cerrada. El teorema relaciona así el cálculo de un flujo (integral de superficie) con una integral triple.

**Interpretación física:** si $\vec{F}$ representa el campo de velocidades de un líquido, un flujo total **positivo** a través de la superficie cerrada indica que sale más líquido del que entra, es decir, que hay una **fuente** dentro de la región.

## Teorema de Gauss para una carga puntual [35:33](https://www.youtube.com/watch?v=LLxa2v7Pjoo&t=2133s)

Se considera el campo característico generado por una carga eléctrica ubicada en el origen:

$$
\vec{F}(x,y,z) = k\,\frac{(x, y, z)}{\|(x,y,z)\|^3}
$$

donde la constante $k$ es positiva si la carga es positiva y negativa si la carga es negativa. Su dominio es $\mathbb{R}^3 - \{(0,0,0)\}$ (no está definido en el origen) y su divergencia es $0$ en todo su dominio.

**Resultado:** el flujo a través de una superficie cerrada $\partial\Omega$ depende de si la región encierra o no al origen:

$$
\oiint_{\partial\Omega} \vec{F} \cdot d\vec{S} =
\begin{cases}
0 & \text{si } (0,0,0) \notin \Omega \\
4k\pi & \text{si } (0,0,0) \in \Omega
\end{cases}
$$

Es notable que, cuando la región encierra a la carga, el flujo vale $4k\pi$ **independientemente de la forma** de la superficie.

**Idea de la demostración:**
- **Caso 1 (el origen no pertenece a $\Omega$):** como $\vec{F}$ está definido y tiene divergencia nula en toda la región, se aplica directamente el teorema de la divergencia y el flujo es $\iiint_{\Omega} 0 \,dV = 0$.
- **Caso 2 (el origen pertenece a $\Omega$):** no se puede aplicar el teorema directamente porque el campo no está definido en el origen. Se "saca" el origen tomando una superficie esférica $S$ centrada en el origen, contenida dentro de $\Omega$, y se considera la región $\Omega_3$ comprendida entre $\partial\Omega$ (exterior) y $S$ (interior) —como un durazno cuyo carozo es la esfera. En $\Omega_3$ sí vale el teorema de la divergencia y, como $\operatorname{div}\vec{F} = 0$, el flujo a través de $\partial\Omega_3$ es cero. Descomponiendo ese flujo en la frontera exterior más el de la esfera (con normal apuntando hacia el origen, cuyo valor ya se calculó: $-4k\pi$), se despeja que el flujo a través de $\partial\Omega$ vale $4k\pi$.

## Ejercicios

<details>
<summary>📝 Ejercicio 1 — <a href="https://www.youtube.com/watch?v=LLxa2v7Pjoo&t=322s">05:22</a>: Divergencia de un campo radial inverso-cuadrático</summary>

Calcular la divergencia del campo vectorial

$$
\vec{F}(x,y,z) = c\,\frac{(x, y, z)}{\left(x^2 + y^2 + z^2\right)^{3/2}}
$$

donde la norma al cubo se escribió como $\|(x,y,z)\|^3 = (x^2+y^2+z^2)^{3/2}$.

<details>
<summary>Ver resolución</summary>

**Paso 1:** Escribir las funciones componentes.

$$
f_1 = \frac{cx}{(x^2+y^2+z^2)^{3/2}}, \quad f_2 = \frac{cy}{(x^2+y^2+z^2)^{3/2}}, \quad f_3 = \frac{cz}{(x^2+y^2+z^2)^{3/2}}
$$

**Paso 2:** Derivar la primera componente respecto de $x$ (regla del cociente; $c$ es constante).

$$
\frac{\partial f_1}{\partial x} = c\,\frac{(x^2+y^2+z^2)^{3/2} - x \cdot \frac{3}{2}(x^2+y^2+z^2)^{1/2} \cdot 2x}{\left[(x^2+y^2+z^2)^{3/2}\right]^2}
$$

El denominador, al elevarse al cuadrado, queda $(x^2+y^2+z^2)^{3}$. Simplificando el numerador:

$$
\frac{\partial f_1}{\partial x} = c\,\frac{(x^2+y^2+z^2)^{1/2}\left[(x^2+y^2+z^2) - 3x^2\right]}{(x^2+y^2+z^2)^{3}}
$$

**Paso 3:** Las derivadas de las otras dos componentes son análogas, cambiando $3x^2$ por $3y^2$ y $3z^2$ respectivamente.

$$
\frac{\partial f_2}{\partial y} = c\,\frac{(x^2+y^2+z^2)^{1/2}\left[(x^2+y^2+z^2) - 3y^2\right]}{(x^2+y^2+z^2)^{3}}
$$

$$
\frac{\partial f_3}{\partial z} = c\,\frac{(x^2+y^2+z^2)^{1/2}\left[(x^2+y^2+z^2) - 3z^2\right]}{(x^2+y^2+z^2)^{3}}
$$

**Paso 4:** Sumar las tres derivadas. Como tienen el mismo denominador, se saca factor común $3c\,(x^2+y^2+z^2)^{1/2}$ en el numerador.

$$
\operatorname{div}\vec{F} = \frac{3c\,(x^2+y^2+z^2)^{1/2}\left[(x^2+y^2+z^2) - (x^2+y^2+z^2)\right]}{(x^2+y^2+z^2)^{3}}
$$

**Paso 5:** El corchete se anula, por lo que la divergencia es nula en todo el dominio.

$$
\operatorname{div}\vec{F} = 0
$$

El campo es **solenoidal**: su divergencia vale $0$ en cualquier punto del espacio donde está definido.

</details>

</details>

<details>
<summary>📝 Ejercicio 2 — <a href="https://www.youtube.com/watch?v=LLxa2v7Pjoo&t=1176s">19:36</a>: Flujo a través de un tetraedro (teorema de la divergencia)</summary>

Calcular el flujo del campo vectorial $\vec{F}(x,y,z) = (x, y, z)$ a través del borde (frontera) del conjunto $\Omega$ formado por los puntos del primer octante ($x, y, z \ge 0$) limitados por el plano $x + y + z = 1$. La frontera está orientada en forma positiva (normales hacia el exterior).

<details>
<summary>Ver resolución</summary>

**Paso 1:** Identificar la región. $\Omega$ es el tetraedro del primer octante limitado por los planos coordenados y el plano $x + y + z = 1$, que corta a los ejes $x$, $y$, $z$ en $1$.

**Paso 2:** En lugar de calcular el flujo cara por cara (las cuatro caras del tetraedro) y sumar, se aplica el teorema de la divergencia.

$$
\oiint_{\partial\Omega} \vec{F} \cdot d\vec{S} = \iiint_{\Omega} \operatorname{div}\vec{F} \,dx\,dy\,dz
$$

**Paso 3:** Calcular la divergencia del campo.

$$
\operatorname{div}\vec{F} = \frac{\partial}{\partial x}(x) + \frac{\partial}{\partial y}(y) + \frac{\partial}{\partial z}(z) = 3
$$

**Paso 4:** Como la divergencia es constante, sale fuera de la integral, que queda igual a $3$ por el volumen de la región.

$$
\iiint_{\Omega} 3 \,dx\,dy\,dz = 3 \iiint_{\Omega} dx\,dy\,dz = 3 \cdot V_\Omega
$$

**Paso 5:** El volumen del tetraedro es $\frac{\text{cateto} \cdot \text{cateto} \cdot \text{cateto}}{6}$.

$$
V_\Omega = \frac{1 \cdot 1 \cdot 1}{6} = \frac{1}{6}
$$

**Paso 6:** Calcular el flujo final.

$$
\oiint_{\partial\Omega} \vec{F} \cdot d\vec{S} = 3 \cdot \frac{1}{6} = \frac{1}{2}
$$

Como el flujo es positivo, si $\vec{F}$ representa un campo de velocidades hay más líquido saliendo que entrando: en la región hay una **fuente**.

</details>

</details>

<details>
<summary>📝 Ejercicio 3 — <a href="https://www.youtube.com/watch?v=LLxa2v7Pjoo&t=1627s">27:07</a>: Flujo a través de una superficie esférica</summary>

Calcular el flujo del campo vectorial $\vec{F}(x,y,z) = (x^3, y^3, z^3)$ a través de una superficie esférica de radio $R$ centrada en el origen, con la frontera orientada en forma positiva (normales hacia el exterior).

<details>
<summary>Ver resolución</summary>

**Paso 1:** Aplicar el teorema de la divergencia, llamando $\Omega$ a la bola encerrada por la superficie esférica.

$$
\oiint_{S} \vec{F} \cdot d\vec{S} = \iiint_{\Omega} \operatorname{div}\vec{F} \,dx\,dy\,dz
$$

**Paso 2:** Calcular la divergencia.

$$
\operatorname{div}\vec{F} = 3x^2 + 3y^2 + 3z^2 = 3(x^2 + y^2 + z^2)
$$

**Paso 3:** Como la región es el interior de una esfera y el integrando depende de $x^2+y^2+z^2$, conviene usar **coordenadas esféricas**.

$$
x = \rho\cos\theta\cos\varphi, \quad y = \rho\cos\theta\sin\varphi, \quad z = \rho\sin\theta
$$

con módulo del jacobiano $|J| = \rho^2\cos\theta$ y donde $x^2+y^2+z^2 = \rho^2$.

**Paso 4:** Determinar los límites de integración para la bola de radio $R$.
- $\rho$ varía entre $0$ y $R$.
- $\theta$ (ángulo con el plano $xy$) varía entre $-\frac{\pi}{2}$ y $\frac{\pi}{2}$.
- $\varphi$ varía entre $0$ y $2\pi$.

**Paso 5:** Plantear la integral, sacando el $3$ y reemplazando el integrando y el jacobiano.

$$
\oiint_{S} \vec{F} \cdot d\vec{S} = 3 \int_{0}^{2\pi} \int_{-\pi/2}^{\pi/2} \int_{0}^{R} \rho^2 \cdot \rho^2\cos\theta \,d\rho\,d\theta\,d\varphi
$$

**Paso 6:** Como los límites son constantes y el integrando se factoriza, se separa en producto de tres integrales simples.

$$
= 3 \left( \int_{0}^{2\pi} d\varphi \right) \left( \int_{-\pi/2}^{\pi/2} \cos\theta \,d\theta \right) \left( \int_{0}^{R} \rho^4 \,d\rho \right)
$$

**Paso 7:** Resolver cada integral simple.

$$
\int_{0}^{2\pi} d\varphi = 2\pi
$$

$$
\int_{-\pi/2}^{\pi/2} \cos\theta \,d\theta = \left[ \sin\theta \right]_{-\pi/2}^{\pi/2} = 1 - (-1) = 2
$$

$$
\int_{0}^{R} \rho^4 \,d\rho = \left[ \frac{\rho^5}{5} \right]_{0}^{R} = \frac{R^5}{5}
$$

**Paso 8:** Multiplicar los resultados.

$$
\oiint_{S} \vec{F} \cdot d\vec{S} = 3 \cdot 2\pi \cdot 2 \cdot \frac{R^5}{5} = \frac{12}{5}\pi R^5
$$

Como $R > 0$, el flujo es positivo: el campo "sale" de la región, es decir, hay una **fuente**.

</details>
